  const konumNotu = KONUM_ISTANBUL_YEDEK ? `<div class="vakit-widget-not">Konumunuz algılanamadı, İstanbul vakitleri gösteriliyor. Aşağıdan ilinizi seçebilirsiniz.</div>` : '';
  const secenekler = [`<option value="__gps"${AKTIF_SEHIR?'':' selected'}>📍 Konumumu kullan</option>`]
    .concat(ILLER.map(il=>il[0]).sort((a,b)=>a.localeCompare(b,'tr')).map(ad=>`<option value="${ad}"${AKTIF_SEHIR===ad?' selected':''}>${ad}</option>`)).join('');
  const konumSecimi = `<div class="vakit-konum"><label for="konumSec">Vakitler:</label><select id="konumSec" aria-label="Namaz vakitleri için il seçin">${secenekler}</select></div>`;
  return `<div class="vakit-widget">

// Arama metni sadeleştirme: küçük harf, şapka/nokta gibi işaretler ve kesme işaretleri kaldırılır.
// Böylece "dua" yazan "duâ"yı, "kuran" yazan "Kur'ân"ı, "sukur" yazan "şükür"ü bulur.
function aramaNormal(s){
  return String(s||'')
    .replace(/<[^>]*>/g,' ')
    .toLocaleLowerCase('tr')
    .replace(/ı/g,'i')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/['’‘`ʼʿʾ´-]/g,'')
    .replace(/\s+/g,' ');
}
function _metinTopla(d){
  const parcalar = [d.title];
  (d.parts||[]).forEach(p=>{ parcalar.push(p.tr, p.label); });
  (d.paragraphs||[]).forEach(p=>{ parcalar.push(typeof p==='string' ? p : p.tr); });
  if(d.note) parcalar.push(d.note);
  (d.noteList||[]).forEach(n=>parcalar.push(n));
  (d.blocks||[]).forEach(b=>{
    parcalar.push(b.text, b.translit, b.tr, b.label, b.before, b.after, b.caption);
    (b.items||[]).forEach(it=>{ if(typeof it==='string') parcalar.push(it); else if(it){ parcalar.push(it.text); (it.sub||[]).forEach(x=>parcalar.push(x)); } });
  });
  return parcalar.filter(x=>typeof x==='string' && x).join(' ');
}
let _aramaIndeksi = null;
function aramaIndeksi(){
  if(_aramaIndeksi) return _aramaIndeksi;
  _aramaIndeksi = [];
  FIHRIST.flatMap(s=>s.items).filter(i=>i.ready && MASTER_DATA[i.key]).forEach(item=>{
    MASTER_DATA[item.key].duas.forEach((d, idx)=>{
      _aramaIndeksi.push({ vk:item.key, idx, d, baslik: aramaNormal(d.title), metin: aramaNormal(_metinTopla(d)) });
    });
  });
  return _aramaIndeksi;
}

function runGlobalSearch(qraw){

  const niyet = AKTIF_NIYET ? NIYETLER.find(n=>n.id===AKTIF_NIYET) : null;
  if(q.length < 2 && !niyet){ resultsEl.innerHTML = AKTIF_ARAMA_BOLUMU!=='hepsi' ? `<div class="search-empty">Bir kelime yazın veya bir niyet seçin.</div>` : ''; return; }
  const kelimeler = q.length >= 2 ? q.split(' ').filter(Boolean) : [];
  const eslesir = (t)=> kelimeler.every(k=>t.includes(k)) && (!niyet || niyet.kelimeler.some(k=>(' '+t).includes(k)));
  const grubu = (vk)=>{ const g = FIHRIST.find(x=>x.items.some(i=>i.key===vk)); return g ? g.groupKey : ''; };
  const bolumUygun = (vk)=> AKTIF_ARAMA_BOLUMU==='hepsi' || grubu(vk)===AKTIF_ARAMA_BOLUMU;
  // Sûre isimleri
  const sureler = (kelimeler.length && !niyet && (AKTIF_ARAMA_BOLUMU==='hepsi' || AKTIF_ARAMA_BOLUMU==='kuran'))
    ? QURAN_DATA.surahs.filter(s=> kelimeler.every(k=>aramaNormal(s.tr+' suresi').includes(k))) : [];
  // Önce başlıkta geçenler, sonra metinde geçenler
  const baslikta = [], metinde = [];
  if(AKTIF_ARAMA_BOLUMU!=='kuran') aramaIndeksi().forEach(k=>{
    if(!bolumUygun(k.vk)) return;
    if(eslesir(k.baslik)) baslikta.push(k);
    else if(eslesir(k.metin)) metinde.push(k);
  });
  const hits = baslikta.concat(metinde);
  const toplam = hits.length + sureler.length;
  if(toplam===0){ resultsEl.innerHTML = `<div class="search-empty">Sonuç bulunamadı.</div>`; return; }
  const LIMIT = 60;
  resultsEl.innerHTML = `<div class="search-empty" style="padding:0 2px 10px;">${toplam} sonuç${toplam>LIMIT?` (ilk ${LIMIT} tanesi gösteriliyor)`:''}</div><div class="search-results">`
    + sureler.slice(0,10).map(s=>`
    <div class="search-result" data-sure="${s.no}">
      <div class="sr-vird">Kur'ân-ı Kerîm</div>
      <div class="sr-title">${s.no}. ${s.tr} Sûresi</div>
    </div>`).join('')
    + hits.slice(0,LIMIT).map(h=>`
    <div class="search-result" data-vk="${h.vk}" data-idx="${h.idx}">
      <div class="sr-vird">${(FIHRIST.find(g=>g.items.some(i=>i.key===h.vk))||{}).name||''} · ${VIRD_TITLES[h.vk]}</div>
      <div class="sr-title">${h.d.title}</div>
    </div>`).join('') + `</div>`;
  resultsEl.querySelectorAll('.search-result').forEach(r=>{
    r.onclick = ()=>{
      closeGlobalSearch();
      if(r.dataset.sure){
        activeSection = 'kuran'; buildTopnav();
        renderSurah(QURAN_DATA.surahs.find(x=>x.no===Number(r.dataset.sure)));
        return;
      }
      const item = FIHRIST.flatMap(s=>s.items).find(i=>i.key===r.dataset.vk);
      const grp = FIHRIST.find(s=>s.items.some(i=>i.key===r.dataset.vk));
      activeSection = grp.groupKey; buildTopnav();
      kulliyatVird = item.key;
      renderVirdContent(item, Number(r.dataset.idx));
    };
  });
}

function kaynakcaKayitlariOlustur(){
  const kodHaritasi = {};
  Object.keys(MASTER_DATA).forEach(key=>{
    const grp = FIHRIST.find(g=>g.items.some(i=>i.key===key));
    const item = grp ? grp.items.find(i=>i.key===key) : null;
    const duas = MASTER_DATA[key].duas || [];
    duas.forEach((d,idx)=>{
      if(!d.codes || !d.codes.length) return;
      d.codes.forEach(kod=>{
        if(!kodHaritasi[kod]) kodHaritasi[kod] = { kod, baslik: null, kayitlar: [], enIyiDua: null };
        kodHaritasi[kod].kayitlar.push({key, idx, groupKey: grp?grp.groupKey:null, itemNo: item?item.no:null, dua:d});
      });
    });
  });
  const liste = Object.values(kodHaritasi).map(grup=>{
    grup.baslik = KAYNAKCA_BASLIK_DUZELTME[grup.kod] || grup.kayitlar[0].dua.title;
    // en iyi (gerçek kaynağı olan / pending olmayan) kaydı temsilci seç
    grup.enIyiDua = grup.kayitlar.find(k=>!k.dua.pendingSource && k.dua.sources && k.dua.sources.length)
      || grup.kayitlar.find(k=>KAYNAK_SAYFALARI[grup.kod])
      || grup.kayitlar[0];
    return grup;
  });
  Object.entries(VIRD_KAYNAK_KODU).forEach(([vk, kod])=>{
    if(liste.some(g=>g.kod===kod) || !KAYNAK_SAYFALARI[kod] || !MASTER_DATA[vk]) return;
    const grp = FIHRIST.find(g=>g.items.some(i=>i.key===vk));
    const item = grp ? grp.items.find(i=>i.key===vk) : null;
    const dua = { title: VIRD_TITLES[vk] + ' — bölüm giriş sayfaları', codes:[kod], sources:[] };
    const kayit = { key:vk, idx:0, groupKey: grp?grp.groupKey:null, itemNo: item?item.no:null, dua };
    liste.push({ kod, baslik: dua.title, kayitlar:[kayit], enIyiDua: kayit });
  });
  liste.sort((a,b)=> a.kod.localeCompare(b.kod, 'tr'));
  return liste;
}

function partHtml(p, showLabel){
  const ar = p.ar, tr = p.tr;
  let html = `<div class="part-block">`;
  if(showLabel && p.label) html += `<div class="part-label">${p.label}</div>`;
  if(langMode==='ar'){
    if(ar) html += `<div class="arabic autoalign">${ar}</div>`;
    else if(tr) html += `<div class="tr-text autoalign">«${tr}»</div><div class="tr-pending-note">Bu kısmın Arapça metni henüz eklenmedi; okunuşu gösteriliyor.</div>`;
  } else {
    if(tr) html += `<div class="tr-text autoalign">«${tr}»</div>`;
    else if(p.arOnly) { /* intentionally no note */ }
    else html += `<div class="tr-pending-note">Bu kısmın Türkçe okunuşu henüz eklenmedi.</div>`;
  }
  if(p.repeat) html += `<div class="repeat-line">${p.repeat} okunur.</div>${sayacHtml(p.repeat)}`;
  html += `</div>`;
  return html;
}
// Tesbih sayacı: "3 kere", "1 veyâ 10 kere" gibi ifadelerdeki en büyük sayıyı hedef alır (3 ve üzeri için gösterilir).
function sayacHtml(repeat){
  const sayilar = (String(repeat).match(/\d+/g) || []).map(Number);
  const hedef = sayilar.length ? Math.max(...sayilar) : 0;
  if(hedef < 3) return '';
  return `<div class="sayac-wrap"><button type="button" class="sayac-btn" data-hedef="${hedef}" data-sayi="0" aria-label="Sayaç: 0 / ${hedef}. Saymak için dokunun">
      <svg class="sayac-halka" viewBox="0 0 44 44" aria-hidden="true"><circle class="sh-arka" cx="22" cy="22" r="19"/><circle class="sh-on" cx="22" cy="22" r="19" style="stroke-dasharray:119.4;stroke-dashoffset:119.4"/></svg>
      <span class="sayac-deger"><b>0</b><small>/${hedef}</small></span>
    </button><button type="button" class="sayac-sifirla" aria-label="Sayacı sıfırla" title="Sıfırla">↺</button></div>`;
}
document.addEventListener('click', (e)=>{
  const sif = e.target.closest && e.target.closest('.sayac-sifirla');
  const btn = sif ? sif.parentElement.querySelector('.sayac-btn') : (e.target.closest && e.target.closest('.sayac-btn'));
  if(!btn) return;
  const hedef = Number(btn.dataset.hedef);
  let sayi = Number(btn.dataset.sayi);
  if(sif) sayi = 0;
  else sayi = sayi >= hedef ? 0 : sayi + 1;
  btn.dataset.sayi = sayi;
  const tamam = sayi >= hedef;
  btn.querySelector('.sayac-deger').innerHTML = tamam ? `<b>✓</b><small>${hedef}</small>` : `<b>${sayi}</b><small>/${hedef}</small>`;
  btn.querySelector('.sh-on').style.strokeDashoffset = String(119.4 * (1 - Math.min(1, sayi/hedef)));
  btn.setAttribute('aria-label', tamam ? `Sayaç tamamlandı: ${hedef}` : `Sayaç: ${sayi} / ${hedef}. Saymak için dokunun`);
  btn.classList.toggle('tamam', tamam);
  btn.classList.remove('vurus'); void btn.offsetWidth; if(!sif) btn.classList.add('vurus');
  try{ if(navigator.vibrate && !sif) navigator.vibrate(tamam ? [60,40,60] : 12); }catch(_){}
});
// Liste maddesi büyük ölçüde Arapça ise, diğer duâ metinleri gibi çerçeveli kutu içinde gösterilir.
function arapcaOrani(t){
  const metin = String(t||'').replace(/<[^>]*>/g,'');
  let harf = 0, arap = 0;
  for(const c of metin){ if(/\p{L}/u.test(c)){ harf++; if(/[؀-ۿݐ-ݿﭐ-﷿ﹰ-﻿]/.test(c)) arap++; } }
  return harf ? arap/harf : 0;
}
function listeMaddesiHtml(li){
  if(typeof li!=='string' || arapcaOrani(li) < 0.5) return `<li>${li}</li>`;
  let metin = li, tekrar = '';
  const m = metin.match(/\(\s*(?:kere\s*)?(\d+)\s*(?:kere)?\s*\)\s*$/);
  if(m){ tekrar = m[1] + ' kere'; metin = metin.slice(0, m.index); }
  metin = metin.trim().replace(/^«\s*/,'').replace(/\s*»$/,'');
  return `<li class="ar-madde"><div class="sigha-block ar-kutu"><div class="arabic autoalign">${markAyet(metin)}</div>${tekrar ? `<div class="repeat-line">${tekrar} okunur.</div>${sayacHtml(tekrar)}` : ''}</div></li>`;
}
function noteBlockHtml(d, uid){
  const items = d.noteList || (d.note ? [d.note] : []);
  if(items.length === 0) return '';
  const bodyHtml = d.noteList
    ? `<ul class="note-list">${items.map(b=>`<li>${b}</li>`).join('')}</ul>`
    : `<p style="margin:0;">${items[0]}</p>`;
  const totalLen = items.join(' ').length;
  const isLong = totalLen > 220 || items.length > 3;
  if(!isLong){
    return `<div class="flow-note">${bodyHtml}</div>`;
  }
  return `<div class="flow-note collapsed" id="note-${uid}">${bodyHtml}</div><button class="note-toggle" onclick="toggleNote('${uid}')">devamını oku…</button>`;
}
function toggleNote(uid){

    ]);
    const style = CENTERED_HEADINGS.has(b.text) ? ' style="text-align:center;"' : '';
    return `<h3 class="article-heading"${style}>${b.text}</h3>`;
  }
  if(b.kind==='bullets') return `<ul class="article-bullets">${b.items.map(listeMaddesiHtml).join('')}</ul>`;
  if(b.kind==='numbered') return `<ol class="article-numbered" start="${startNum||1}">${b.items.map(listeMaddesiHtml).join('')}</ol>`;
  if(b.kind==='lettered') return `<ol class="article-lettered" type="a">${b.items.map(li=>`<li>${li}</li>`).join('')}</ol>`;
  if(b.kind==='numbered_nested'){
    return `<ol class="article-numbered" start="${b.start||1}">${b.items.map(it=>`<li>${it.text}${it.sub?`<ol class="article-lettered" type="a">${it.sub.map(s=>`<li>${s}</li>`).join('')}</ol>`:''}</li>`).join('')}</ol>`;
  }
  if(b.kind==='p_phrase'){
    const phrase = langMode==='ar' ? `<span class="inline-ar">${b.ar}</span>` : (b.translit ? `«${markAyet(b.translit)}»` : `<span class="inline-ar">${b.ar}</span>`);
    return `<p class="article-p">${b.before} ${phrase} ${b.after}</p>`;
  }
  if(b.kind==='inline_ar_note'){
    return `<div class="inline-note"><span class="inline-ar">${markAyet(b.ar)}</span></div><p class="article-p inline-note-meaning">«${b.tr}»</p>`;
  }
  if(b.kind==='image'){
    return `<div class="article-image"><img src="${b.src}" alt="${b.alt||''}" loading="lazy">${b.caption?`<div class="article-image-caption">${b.caption}</div>`:''}</div>`;
  }
  if(b.kind==='sigha' || b.kind==='quote'){
    let top;
    if(langMode==='ar'){
      top = `<div class="arabic autoalign" style="margin:14px 0;">${markAyet(b.ar)}</div>`;
    } else if(b.translit){
      top = `<div class="tr-text autoalign" style="margin-bottom:10px;">«${markAyet(b.translit)}»</div>`;
    } else if(b.arOnly){
      top = `<div class="arabic autoalign" style="margin:14px 0;">${markAyet(b.ar)}</div>`;
    } else {
      top = `<div class="arabic autoalign" style="margin:14px 0;">${markAyet(b.ar)}</div><div class="tr-pending-note">Bu kısmın Türkçe okunuşu henüz eklenmedi.</div>`;
    }
    const translation = b.tr ? `<div class="sigha-translation">${b.tr}</div>` : '';
    const repeatNote = b.repeat ? `<div class="repeat-line">${b.repeat} okunur.</div>${sayacHtml(b.repeat)}` : '';
    const sinif = kutusuz ? 'sigha-block sigha-block-duz' : 'sigha-block';
    return `<div class="${sinif}">${b.label?`<div class="part-label">${b.label}</div>`:''}${top}${translation}${repeatNote}</div>`;
  }
  return '';
}
function entryBodyHtml(d, uid){
  if(d.kind==='article'){
    // Bu başlıklar, içinde bulundukları listeyi BÖLMEZ — sadece aynı listenin devamındaki
    // maddeler için ara etikettir, o yüzden numaralandırmayı sıfırlamazlar.
    const SIRALAMAYI_BOLMEYEN_BASLIKLAR = new Set([
      "Her ayın hilâli görüldüğünde okunacak duâlar",
      "Her ayın hilâli görüldüğünde okunacak duâlar:",
      "Tebârake (Mülk) Sûresi",
      "Bu duâ ile ilgili faydalı mâlûmât",
      "Âyet-i kerîmelerin ve zikirlerin birlikte okunuşu:",
      "Âyet-i kerîmelerin ve zikirlerin birlikte okunuşu",
    ]);
    // Bu başlıktan sonraki İLK alıntı kutusu ("koca kutu", tüm hilâl duâlarını toplu gösterir) kalır;
    // ondan sonra gelen, aynı bölümdeki diğer alıntı kutuları (râvî râvî tekrarlar) kutusuz gösterilir.
    const KUTU_INDIRGE_BASLIKLAR = new Set([
      "Her ayın hilâli görüldüğünde okunacak duâlar",
      "Her ayın hilâli görüldüğünde okunacak duâlar:",
    ]);
    let numaraliSayac = 1;
    let kutuIndirgeModu = false;
    let ilkKutuGosterildi = false;
    const bloklar = d.blocks.map(b=>{
      if(b.kind==='heading'){
        if(!SIRALAMAYI_BOLMEYEN_BASLIKLAR.has(b.text)) numaraliSayac = 1;
        kutuIndirgeModu = KUTU_INDIRGE_BASLIKLAR.has(b.text);
        ilkKutuGosterildi = false;
        return articleBlockHtml(b);
      }
      if(b.kind==='numbered'){
        kutuIndirgeModu = false;
        const html = articleBlockHtml(b, numaraliSayac);
        numaraliSayac += b.items.length;
        return html;
      }
      if((b.kind==='quote' || b.kind==='sigha') && kutuIndirgeModu){
        if(!ilkKutuGosterildi){ ilkKutuGosterildi = true; return articleBlockHtml(b); }
        return articleBlockHtml(b, null, true);
      }
      return articleBlockHtml(b);
    }).join('');
    return `<div class="article-body">${bloklar}</div>`;
  }
  if(d.kind==='info'){
    return `<div class="info-paragraphs">${d.paragraphs.map(p=>`<p>${p}</p>`).join('')}</div>`;
  }
  if(d.kind==='richtext2'){
    let html = '';
    let lastLabelIsMuezzin = false;
    let noteBuf = [];
    const flushNotes = ()=>{
      if(noteBuf.length){
        html += `<div class="rt-note">${noteBuf.join(' ')}</div>`;
        noteBuf = [];
      }
    };
    d.paragraphs.forEach(p=>{
      const txt = langMode==='ar' ? p.ar : p.tr;
      if(p.kind==='label'){
        flushNotes();
        lastLabelIsMuezzin = /müezzin/i.test(p.tr);
        html += `<div class="rt-label">${txt}</div>`;
      } else if(p.kind==='subtitle'){
        flushNotes();
        html += `<div class="rt-subtitle">${txt}</div>`;
      } else if(p.kind==='response'){
        flushNotes();
        const cls = langMode==='ar' ? 'arabic' : 'tr-text';
        html += `<div class="rt-response${lastLabelIsMuezzin?' rt-emphasis':''}"><div class="${cls} autoalign">${txt}</div></div>`;
        lastLabelIsMuezzin = false;
      } else {
        noteBuf.push(txt);
      }
    });
    flushNotes();
    return html;
  }
  let html = d.parts.map(p=>partHtml(p, true)).join('');
  html += noteBlockHtml(d, uid);
  return html;
}

/* ================= KAYNAKÇA: citation view ================= */
function gotoKaynakcaEntry(kod){
  const yol = 'kaynakca/kod/'+encodeURIComponent(kod);
  setRoute(yol);
  const onceki = rotaIsleniyor; rotaIsleniyor = true;
  try{ goSection('kaynakca'); setRoute(yol); } finally { rotaIsleniyor = onceki; }
  requestAnimationFrame(()=>{
    const node = document.getElementById(`kaynak-kod-${kod}`);
    if(node){
      node.scrollIntoView({behavior:'smooth', block:'center'});
      node.classList.add('flash');
      setTimeout(()=>node.classList.remove('flash'), 1600);
    }
  });
}
function citeTagsHtml(d, sayfaSayisi){
  if(sayfaSayisi===undefined) sayfaSayisi = kaynakGorselAdresleri(d.codes).length;
  if(d.pendingSource || !d.sources || d.sources.length===0){
    return sayfaSayisi ? `<span class="kaynak-cite">Kitap sayfası · ${sayfaSayisi} sayfa</span>` : `<span class="kaynak-cite">Kaynak görseli yüklenecek</span>`;
  }
  return d.sources.map(s=>`<span class="kaynak-cite">${s.author?s.author+', ':''}${s.book}${s.volume?', Cilt '+s.volume:''}, s. ${s.pages}</span>`).join('');
}
function kodEtiketleriHtml(codes){
  if(!codes || !codes.length) return '';
  return codes.map(k=>`<span class="dua-code dua-code-link" data-kod="${k}">${k}</span>`).join(' ');
}

/* ================= gallery modal ================= */
let lbState = { imgs:[], idx:0, title:'' };
let _sonOdak = null;
function openGallery(kodlar, title){
  const imgs = kaynakGorselAdresleri(Array.isArray(kodlar) ? kodlar : [kodlar]);
  if(!imgs.length) return;
  _sonOdak = document.activeElement;
  document.getElementById('galleryModal').classList.add('open');
  lbState = { imgs, idx:0, title: title||'' };
  renderLightbox();
}
function renderLightbox(){
  const { imgs, idx, title } = lbState;
  const box = document.getElementById('modalBox');
  box.innerHTML = `
    <div class="lightbox">
      <div class="lightbox-head">
        <div><div class="lb-title">${title}</div><div class="lb-count">${idx+1} / ${imgs.length} — kaynak sayfası</div></div>
        <button class="lightbox-close" onclick="closeGallery()" aria-label="Kapat">✕</button>
      </div>
      <div class="lightbox-stage">
        <button class="lb-nav lb-prev" ${idx<=0?'disabled':''} onclick="lbStep(-1)" aria-label="Önceki sayfa">‹</button>
        <img src="${imgs[idx]}" alt="${escapeHtml(title)} — kaynak sayfası ${idx+1}" decoding="async" onerror="this.replaceWith(Object.assign(document.createElement('div'),{className:'lb-hata',textContent:'Sayfa yüklenemedi. İnternet bağlantınızı kontrol edin.'}))">
        <button class="lb-nav lb-next" ${idx>=imgs.length-1?'disabled':''} onclick="lbStep(1)" aria-label="Sonraki sayfa">›</button>
      </div>
      ${imgs.length>1 && imgs.length<=24?`<div class="lb-dots">${imgs.map((_,i)=>`<button class="lb-dot ${i===idx?'active':''}" onclick="lbGoto(${i})"></button>`).join('')}</div>`:''}
    </div>`;
  lbOnYukle();
}
function lbOnYukle(){ const s = lbState.imgs[lbState.idx+1]; if(s){ const im = new Image(); im.src = s; } }
function lbStep(dir){
  const n = lbState.idx + dir;
  if(n<0 || n>=lbState.imgs.length) return;
  lbState.idx = n; renderLightbox();
}
function lbGoto(i){ lbState.idx = i; renderLightbox(); }
function closeGallery(){
  document.getElementById('galleryModal').classList.remove('open');
  if(_sonOdak && _sonOdak.focus) try{ _sonOdak.focus(); }catch(e){}
}
document.addEventListener('keydown', (e)=>{
  if(!document.getElementById('galleryModal').classList.contains('open')) return;
  if(e.key==='Escape') closeGallery();
  if(e.key==='ArrowLeft') lbStep(-1);
  if(e.key==='ArrowRight') lbStep(1);
});
document.getElementById('galleryModal').addEventListener('click', (e)=>{ if(e.target.id==='galleryModal') closeGallery(); });
(()=>{ let x0 = null;
  const m = document.getElementById('galleryModal');
  m.addEventListener('touchstart', e=>{ x0 = e.touches.length===1 ? e.touches[0].clientX : null; }, {passive:true});
  m.addEventListener('touchend', e=>{ if(x0===null) return; const dx = e.changedTouches[0].clientX - x0; x0 = null; if(Math.abs(dx) > 50) lbStep(dx < 0 ? 1 : -1); }, {passive:true});
})();

/* ================= typography auto-align ================= */
function adjustTextAlignment(){
  document.querySelectorAll('.autoalign').forEach(node=>{
    const cs = getComputedStyle(node);
    let lh = parseFloat(cs.lineHeight);
    if(isNaN(lh)) lh = parseFloat(cs.fontSize)*1.4;
    const isMulti = node.scrollHeight > lh*1.6;
    node.classList.toggle('multiline', isMulti);
    node.classList.toggle('singleline', !isMulti);
  });
}

/* ================= erişilebilirlik: tıklanabilir kutular klavyeyle de çalışsın ================= */
const TIKLANABILIR = '#anaZikirmatik, .sohbet-oda-satir, .yazi-kart, .ana-kart[data-git], .ana-kart[data-yazi], .yaklasan-satir, .fihrist-row, .ana-kart[data-group], .ana-kart-vird-satir, .search-result, .ozel-banner[data-ay], .dua-code-link, .crumb[id], #logoBtn, #titleBtn';
function erisilebilirlikUygula(kok){
  (kok||document).querySelectorAll(TIKLANABILIR).forEach(n=>{
    if(!n.hasAttribute('role')) n.setAttribute('role','button');
    if(!n.hasAttribute('tabindex')) n.setAttribute('tabindex','0');
  });
}
document.addEventListener('keydown', (e)=>{
  if(e.key!=='Enter' && e.key!==' ') return;
  const t = e.target;
  if(!t || !t.matches || t.matches('button, a, input, textarea, select')) return;
  if(t.getAttribute('role')==='button'){ e.preventDefault(); t.click(); }
});
new MutationObserver(()=> erisilebilirlikUygula()).observe(document.getElementById('app'), {childList:true, subtree:true});

/* ================= init ================= */
document.getElementById('titleBtn').onclick = ()=> goSection('anasayfa');
document.getElementById('logoBtn').onclick = ()=> goSection('anasayfa');
document.getElementById('themeBtn').onclick = temaDegistir;
document.getElementById('zikirmatikBtn').onclick = ()=> Zikirmatik.ac();
aramaCipleriniCiz();
buildTopnav();
calStripRender();
konumBelirleVeBaslat(()=>{ calStripRender(); if(activeSection==='anasayfa' && !location.hash.replace(/^#\/?/,'')) renderAnaSayfa(); });
route();
erisilebilirlikUygula();

/* Çevrimdışı kullanım (yalnızca sitede yayındayken; dosyadan açıldığında çalışmaz) */
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load', ()=> navigator.serviceWorker.register('sw.js').catch(()=>{}));
  // Yeni sürüm devreye girince sayfayı bir kez yenile (eski ve yeni dosyalar karışmasın)
  if(navigator.serviceWorker.controller){
    let yenilendi = false;
    navigator.serviceWorker.addEventListener('controllerchange', ()=>{ if(yenilendi) return; yenilendi = true; location.reload(); });
  }
}
</script>
