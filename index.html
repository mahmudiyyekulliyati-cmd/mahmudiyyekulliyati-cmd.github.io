<style>
@font-face {
  font-family: 'Shaikh Hamdullah Mushaf';
  src: url('assets/fonts/ShaikhHamdullahMushaf.ttf') format('truetype');
  font-weight: normal;
  font-style: normal;
  font-display: swap;
}
/* ﷺ ve ﷻ işaretleri: Latin yazı tiplerinde bulunmadığı için küçük ve okunaksız çıkıyordu.
   Amiri yazı tipinin sadece bu iki işareti içeren küçük parçası kullanılır (unicode-range sayesinde
   diğer harfler etkilenmez) ve metne uygun boyuta büyütülür. */
@font-face {
  font-family: 'Salavat';
  src: url('assets/fonts/amiri-salavat.woff2') format('woff2');
  unicode-range: U+FDFA-FDFB;
  font-weight: 100 900;
  font-style: normal;
  size-adjust: 145%;
  ascent-override: 75%;
  descent-override: 25%;
  font-display: swap;
}
::-webkit-scrollbar{ width:10px; height:10px; }
::-webkit-scrollbar-track{ background:#f7f0e3; }
::-webkit-scrollbar-thumb{ background:#d8c393; border-radius:100px; border:2px solid #f7f0e3; }
::-webkit-scrollbar-thumb:hover{ background:#a8823a; }
html{ scrollbar-color:#d8c393 #f7f0e3; scrollbar-width:thin; }
:root{
  color-scheme: light;
  --ink:#2b2018; --ink-soft:#5b4c3f;
  --paper:#f7f0e3; --paper-card:#fffcf5; --paper-raised:#fff9ee;
  --crimson:#8a1c2a; --crimson-dark:#5e131c; --crimson-wash:#f3e2e0;
  --gold:#a8823a; --gold-soft:#e7d7ab;
  --line:#e5d6b8; --line-soft:#efe4cc; --info-bg:#efe9da;
  --shadow: 0 10px 30px -12px rgba(60,30,20,0.25);
}
*{box-sizing:border-box;}
html,body{margin:0;padding:0;}
body{ background:var(--paper); color:var(--ink); font-family:'Salavat','EB Garamond', serif; font-size:17px; line-height:1.65; -webkit-font-smoothing:antialiased; }
::selection{ background:var(--gold-soft); }
a{color:var(--crimson);}
.eyebrow{ font-family:'Salavat','Inter',sans-serif; font-size:11.5px; letter-spacing:.14em; text-transform:uppercase; color:var(--gold); font-weight:600; }
h1,h2,h3,h4{ font-family:'Salavat','Cormorant Garamond', serif; font-weight:600; margin:0 0 .3em 0; color:var(--crimson-dark); }
.arabic{ font-family:'Shaikh Hamdullah Mushaf','Scheherazade New', serif; direction:rtl; font-size:calc(1.85rem * var(--dua-scale, 1)); line-height:2.3; color:var(--ink); unicode-bidi:plaintext; text-align:right; }
.arabic.singleline{ text-align:center; }
.arabic.multiline{ text-align:justify; text-align-last:center; }
.tr-text{ font-family:'Salavat','EB Garamond',serif; font-size:calc(1.22rem * var(--dua-scale, 1)); font-weight:600; line-height:1.7; color:var(--ink); }
.tr-text.singleline{ text-align:center; }
.tr-text.multiline{ text-align:justify; text-align-last:center; }

#app{ max-width:960px; margin:0 auto; }
.topbar{ display:flex; align-items:center; gap:16px; padding:22px 28px 14px; position:relative; }
.cal-strip{ display:flex; justify-content:flex-end; align-items:center; gap:10px; padding:2px 28px 10px; font-family:'Salavat','EB Garamond',serif; font-size:.82rem; color:var(--ink-soft); border-bottom:1px solid var(--line); flex-wrap:wrap; }
.cal-strip .cal-item{ white-space:nowrap; }
.cal-strip .cal-sep{ opacity:.5; }
.cal-strip .cal-note{ font-size:.72rem; opacity:.7; cursor:help; }
@media(max-width:520px){ .cal-strip{ justify-content:center; padding:2px 12px 10px; font-size:.76rem; } }
.ana-kartlar{ display:flex; flex-direction:column; gap:12px; margin-top:18px; }
.ana-kart{ border:1px solid var(--line); border-radius:12px; padding:16px 18px; cursor:pointer; background:var(--paper-card); transition:border-color .15s; }
.ana-kart:hover{ border-color:var(--crimson); }
.ana-kart-baslik{ font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:4px; }
.ana-kart-isim{ font-family:'Salavat','Cormorant Garamond',serif; font-size:1.25rem; color:var(--crimson-dark); }
.ana-kart-bos{ cursor:default; opacity:.65; }
.ana-kart-bos:hover{ border-color:var(--line); }
.ana-kart-liste{ cursor:default; }
.ana-kart-liste:hover{ border-color:var(--line); }
.ana-kart-vird-satir{ padding:6px 2px; font-family:'Salavat','Cormorant Garamond',serif; font-size:1.08rem; color:var(--crimson-dark); cursor:pointer; border-bottom:1px solid var(--gold-soft); }
.ana-kart-vird-satir:last-child{ border-bottom:none; }
.ana-kart-vird-satir:hover{ text-decoration:underline; }
.ana-kart-durum{ font-size:.9rem; color:var(--ink-soft); font-style:italic; }
.ana-banner{ margin-top:14px; padding:10px 16px; border-radius:10px; background:var(--crimson); color:#fff9ee; font-family:'Salavat','Cormorant Garamond',serif; font-size:1.05rem; text-align:center; }
.ozel-banner{ margin-top:14px; padding:18px 20px; border-radius:12px; background:linear-gradient(135deg, var(--crimson-wash), var(--paper-raised)); border:1px solid var(--crimson); text-align:center; }
.ozel-banner-baslik{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:600; font-size:1.15rem; color:var(--crimson-dark); letter-spacing:.02em; margin-bottom:4px; }
.ozel-banner-aciklama{ font-family:'Salavat','EB Garamond',serif; font-size:.88rem; color:var(--ink-soft); margin-bottom:10px; }
.ozel-banner-arabic{ font-family:'Shaikh Hamdullah Mushaf','Scheherazade New','Amiri Quran',serif; font-size:1.3rem; color:var(--ink); line-height:2; margin-bottom:6px; }
.ozel-banner-translit{ font-family:'Salavat','EB Garamond',serif; font-style:italic; font-size:.9rem; color:var(--ink-soft); margin-bottom:6px; }
.ozel-banner-tr{ font-family:'Salavat','EB Garamond',serif; font-size:.88rem; color:var(--ink); }
.ozel-banner[data-ay]{ cursor:pointer; transition:border-color .15s; }
.ozel-banner[data-ay]:hover{ border-color:var(--crimson-dark); }
.ozel-banner-uyari{ background:linear-gradient(135deg, #f4ead8, var(--paper-raised)); border-color:#c9a96b; }
.ozel-banner-uyari .ozel-banner-baslik{ color:#8a6a2e; }
.vakit-widget{ margin-top:14px; padding:16px 18px; border-radius:12px; background:var(--paper-card); border:1px solid var(--line); }
.vakit-widget-baslik{ font-size:.78rem; text-transform:uppercase; letter-spacing:.04em; color:var(--ink-soft); margin-bottom:10px; text-align:center; }
.vakit-widget-satir{ display:flex; justify-content:space-between; gap:6px; flex-wrap:wrap; }
.vakit-kutu{ flex:1; min-width:70px; text-align:center; padding:8px 4px; border-radius:8px; }
.vakit-kutu.vakit-aktif{ background:var(--crimson); }
.vakit-kutu.vakit-aktif .vakit-ad, .vakit-kutu.vakit-aktif .vakit-saat{ color:#fff9ee; }
.vakit-ad{ font-size:.72rem; text-transform:uppercase; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:3px; }
.vakit-saat{ font-family:'Salavat','Cormorant Garamond',serif; font-size:1.15rem; color:var(--crimson-dark); font-weight:600; }
.vakit-widget-not{ margin-top:10px; font-size:.78rem; color:var(--ink-soft); text-align:center; font-style:italic; }
@media(max-width:480px){ .vakit-kutu{ min-width:29%; } }
.topbar img.logo{ width:46px; height:46px; border-radius:50%; box-shadow:var(--shadow); flex:none; cursor:pointer; }
.topbar .titles{ flex:1; min-width:0; cursor:pointer; }
.topbar h1{ font-size:1.5rem; margin:0; }
.topbar .tagline{ font-family:'Salavat','EB Garamond',serif; font-style:italic; color:var(--ink-soft); font-size:.86rem; margin-top:2px; }
.search-btn{ flex:none; width:42px; height:42px; border-radius:50%; border:1px solid var(--line); background:var(--paper-card); color:var(--crimson-dark); cursor:pointer; display:flex; align-items:center; justify-content:center; }
.search-btn:hover{ border-color:var(--crimson); }
.etiket-bar{ display:flex; flex-wrap:wrap; gap:8px; margin:4px 0 18px; }
.etiket-chip{ font-family:'Salavat','Inter',sans-serif; font-size:12px; font-weight:600; color:var(--crimson-dark); background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:6px 14px; cursor:pointer; transition:border-color .15s, background .15s; }
.etiket-chip:hover{ border-color:var(--crimson); }
.etiket-chip-aktif{ background:var(--crimson); color:#fff9ee; border-color:var(--crimson); }
.etiket-chip-tumu{ font-weight:700; }
.search-btn.active{ background:var(--crimson); color:#fff9ee; border-color:var(--crimson); }
.global-search-panel{ display:none; padding:0 28px 18px; }
.global-search-panel.open{ display:block; }

.topnav{
  display:flex; gap:4px; padding:0 24px; border-bottom:1px solid var(--line);
  position:sticky; top:0; background:var(--paper); z-index:40; overflow-x:auto;
  scrollbar-width:none; -ms-overflow-style:none;
}
.topnav::-webkit-scrollbar{ display:none; }
.topnav button{
  font-family:'Salavat','Inter',sans-serif; font-size:13.5px; font-weight:600; color:var(--ink-soft);
  background:none; border:none; padding:14px 16px; cursor:pointer; white-space:nowrap;
  border-bottom:2.5px solid transparent; margin-bottom:-1px;
}
.topnav button.active{ color:var(--crimson-dark); border-bottom-color:var(--crimson); }
.topnav button:hover{ color:var(--crimson-dark); }

.content{ padding:34px 26px 100px; }
.crumb{ font-family:'Salavat','Inter',sans-serif; font-size:12px; color:var(--ink-soft); letter-spacing:.03em; margin-bottom:16px; cursor:pointer; }
.back-bar{
  position:sticky; top:45px; z-index:35; background:var(--paper); border-bottom:1px solid var(--line);
  display:flex; align-items:center; gap:14px; padding:13px 26px; margin:-34px -26px 26px;
}
.back-btn{
  font-family:'Salavat','Inter',sans-serif; font-weight:600; font-size:13px; color:var(--crimson-dark);
  background:var(--crimson-wash); border:1px solid var(--crimson); border-radius:100px; padding:7px 15px; cursor:pointer;
  flex:none; white-space:nowrap;
}
.back-btn:hover{ background:var(--crimson); color:#fff9ee; }
.back-current{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; color:var(--ink); font-size:1.05rem; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.crumb b{ color:var(--crimson-dark); }
.crumb .sep{ margin:0 6px; opacity:.5; }

.hero-card{ background:var(--paper-card); border:1px solid var(--line); border-radius:16px; padding:36px 38px; box-shadow:var(--shadow); position:relative; overflow:hidden; }
.hero-card::before{ content:""; position:absolute; top:-40px; right:-40px; width:180px; height:180px; border-radius:50%; background:radial-gradient(circle, var(--crimson-wash), transparent 70%); }
.hero-card .eyebrow{ margin-bottom:10px; display:block; }
.hero-card h2{ font-size:2rem; margin-bottom:14px; }
.hero-card p{ color:var(--ink); }
.hero-card .basmala{ font-family:'Shaikh Hamdullah Mushaf','Scheherazade New',serif; font-size:1.4rem; color:var(--crimson); margin:18px 0; direction:rtl; text-align:center; }
.divider{ display:flex; align-items:center; gap:14px; margin:30px 0; color:var(--gold); }
.divider::before, .divider::after{ content:""; flex:1; height:1px; background:var(--line); }
.divider span{ font-size:.85rem; letter-spacing:.2em; }
.about-block h3{ font-size:1.25rem; margin-top:24px; }
.about-block p{ margin:.6em 0; }

.basmala-block{ margin:20px 0 26px; text-align:center; }
.basmala-line{ font-family:'Shaikh Hamdullah Mushaf','Scheherazade New', serif; font-size:1.5rem; color:var(--crimson); direction:rtl; line-height:2.1; }
.about-p{ font-family:'Salavat','EB Garamond',serif; font-size:1.06rem; line-height:1.85; color:var(--ink); margin:0 0 18px; text-align:justify; text-align-last:center; }
.about-list-plain{ margin:0 0 18px; padding-left:26px; }
.about-list-plain li{ font-family:'Salavat','EB Garamond',serif; font-size:1.06rem; line-height:1.85; color:var(--ink); margin-bottom:8px; text-align:justify; text-align-last:center; }
.about-section{ margin:34px 0; }
.about-roman{
  font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.25rem; letter-spacing:.05em;
  color:var(--crimson-dark); text-align:center; margin:0 0 12px;
  display:flex; align-items:center; gap:14px;
}
.about-roman::before, .about-roman::after{ content:""; flex:1; min-width:24px; height:1px; background:var(--gold-soft); }
.about-items{ margin-top:16px; display:flex; flex-direction:column; gap:16px; }
.about-item{ border-top:1px solid var(--line-soft); padding-top:14px; }
.about-item:first-child{ border-top:none; padding-top:0; }
.ai-title{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.02rem; color:var(--crimson); text-align:center; margin-bottom:6px; }
.ai-desc{ font-family:'Salavat','EB Garamond',serif; font-size:.98rem; line-height:1.7; color:var(--ink-soft); text-align:justify; text-align-last:center; }
@media (max-width:520px){ .about-roman{ font-size:1rem; letter-spacing:.02em; gap:8px; } .about-roman::before, .about-roman::after{ min-width:28px; } }

.empty-card{ background:var(--paper-card); border:1px dashed var(--gold-soft); border-radius:16px; padding:54px 40px; text-align:center; }
.empty-card .glyph{ font-size:2.2rem; color:var(--gold); margin-bottom:12px; font-family:'Shaikh Hamdullah Mushaf','Scheherazade New',serif; }
.empty-card p{ color:var(--ink-soft); font-family:'Salavat','Inter',sans-serif; font-size:14px; }

.fihrist-search{ width:100%; padding:11px 14px; margin-bottom:20px; border:1px solid var(--line); border-radius:10px; font-family:'Salavat','EB Garamond',serif; font-size:15px; background:var(--paper-card); color:var(--ink); }
.fihrist-search:focus{ outline:2px solid var(--gold-soft); border-color:var(--gold); }
.search-results{ margin-bottom:26px; }
.search-result{ background:var(--paper-card); border:1px solid var(--line); border-radius:10px; padding:12px 16px; margin-bottom:8px; cursor:pointer; }
.search-result:hover{ border-color:var(--crimson); }
.search-result .sr-vird{ font-family:'Salavat','Inter',sans-serif; font-size:10.5px; color:var(--gold); font-weight:700; letter-spacing:.05em; text-transform:uppercase; }
.search-result .sr-title{ font-family:'Salavat','EB Garamond',serif; font-size:1rem; color:var(--ink); margin-top:2px; }
.search-empty{ font-family:'Salavat','Inter',sans-serif; font-size:13px; color:var(--ink-soft); font-style:italic; padding:10px 2px 26px; }

.fihrist-section{ margin-bottom:28px; }
.fihrist-section h4{ font-family:'Salavat','Inter',sans-serif; font-weight:700; font-size:12.5px; letter-spacing:.1em; text-transform:uppercase; color:var(--crimson-dark); margin-bottom:12px; }
.fihrist-row{
  display:flex; align-items:baseline; gap:12px; padding:11px 4px; cursor:pointer;
  border-bottom:1px solid var(--line-soft);
}
.fihrist-row:hover .fr-title{ color:var(--crimson-dark); }
.fihrist-row .fr-no{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; color:var(--gold); font-size:1.15rem; width:22px; flex:none; }
.fihrist-row .fr-title{ flex:1; font-size:1.15rem; color:var(--gold); font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; }
.fihrist-row .fr-dot{ width:6px; height:6px; border-radius:50%; flex:none; }
.fihrist-row .fr-dot.ready{ background:var(--crimson); }
.fihrist-row .fr-dot.pending{ border:1px solid var(--gold-soft); }

.vird-header h2{ font-size:1.85rem; margin-bottom:14px; }
.dua-code{ font-family:'Salavat','Inter',sans-serif; font-size:11px; letter-spacing:.08em; color:var(--ink-soft); opacity:.55; margin-top:-8px; margin-bottom:14px; }
.dua-code-link{ cursor:pointer; background:var(--gold-soft); color:var(--crimson-dark); padding:2px 9px; border-radius:100px; transition:background .15s; }
.dua-code-link:hover{ background:var(--gold); color:#fff9ee; }
.flow-head .dua-code{ display:inline; margin:0 0 0 10px; }
.kaynak-title .dua-code{ display:inline; margin:0 0 0 8px; }
.vird-toolbar{ display:flex; align-items:center; justify-content:space-between; margin-bottom:26px; gap:12px; flex-wrap:wrap; }
.size-toggle{ display:inline-flex; border:1px solid var(--line); border-radius:100px; padding:3px; background:var(--paper-card); }
.size-toggle button{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:14px; padding:6px 14px; border-radius:100px; border:none; background:none; cursor:pointer; color:var(--ink-soft); }
.size-toggle button:hover{ background:var(--crimson-wash); color:var(--crimson-dark); }
#sizeMinus{ font-size:12px; }
#sizePlus{ font-size:16px; }
.lang-toggle{ display:inline-flex; border:1px solid var(--line); border-radius:100px; padding:3px; background:var(--paper-card); }
.lang-toggle button{ font-family:'Salavat','Inter',sans-serif; font-size:12.5px; font-weight:600; padding:7px 17px; border-radius:100px; border:none; background:none; cursor:pointer; color:var(--ink-soft); }
.lang-toggle button.active{ background:var(--crimson); color:#fff9ee; }

.malumat-panel{ background:var(--info-bg); border:1px solid var(--line); border-left:4px solid var(--gold); border-radius:4px 14px 14px 4px; padding:20px 26px; margin:0 0 34px; }
.malumat-panel .m-head{ display:flex; align-items:center; gap:12px; cursor:pointer; }
.malumat-panel .m-head .glyph{ font-family:'Shaikh Hamdullah Mushaf','Scheherazade New',serif; color:var(--gold); font-size:1.4rem; flex:none; }
.malumat-panel .m-head h3{ margin:0; flex:1; color:var(--ink-soft); font-family:'Salavat','Inter',sans-serif; font-weight:700; letter-spacing:.03em; text-transform:uppercase; font-size:12px; }
.malumat-panel .m-head .toggle-txt{ font-family:'Salavat','Inter',sans-serif; font-size:12px; color:var(--gold); font-weight:600; white-space:nowrap; }
.malumat-body{ display:none; margin-top:14px; color:var(--ink-soft); font-size:.97rem; }
.malumat-body.open{ display:block; }
.malumat-body p{ margin:0 0 1em; text-align:justify; text-align-last:left; }

/* continuous single-surface dua flow */
.flow-surface{ background:var(--paper-card); border:1px solid var(--line); border-radius:16px; padding:8px 34px; box-shadow:var(--shadow); }
.flow-section-title{
  font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.15rem; letter-spacing:.04em;
  color:var(--crimson); text-align:center; padding:26px 0 16px; border-top:1px solid var(--line-soft); margin-top:6px;
  display:flex; align-items:center; gap:14px;
}
.flow-section-title:first-child{ border-top:none; margin-top:0; padding-top:24px; }
.flow-section-title::before, .flow-section-title::after{ content:""; flex:1; height:1px; background:var(--gold-soft); }
.flow-entry{ padding:20px 0; border-top:1px solid var(--line-soft); scroll-margin-top:70px; }
.flow-entry:first-of-type, .flow-section-title + .flow-entry{ border-top:none; }
.flow-entry.flash{ background:var(--crimson-wash); margin:0 -34px; padding:20px 34px; border-radius:8px; }
.acc-section{ border-top:1px solid var(--line-soft); margin-top:6px; }
.acc-section:first-child{ border-top:none; margin-top:0; }
.acc-head{
  display:flex; align-items:center; gap:12px; cursor:pointer; padding:22px 4px; user-select:none;
}
.acc-head .acc-arrow{ font-family:'Salavat','Inter',sans-serif; color:var(--gold); font-size:13px; flex:none; transition:transform .2s ease; }
.acc-head .acc-title{

}
.acc-head::after{ content:""; flex:0 0 auto; width:60px; height:1px; background:var(--gold-soft); }

.acc-body{ display:none; }
.acc-section.open .acc-body{ display:block; }
.acc-body .flow-entry:first-of-type{ border-top:none; }
.flow-head{ display:flex; align-items:baseline; gap:12px; margin-bottom:10px; }

.part-block{ margin-bottom:14px; }

.part-label{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.02rem; color:var(--crimson); text-align:left; margin-bottom:8px; letter-spacing:.02em; }
.sigha-block .part-label{ text-align:center; }
.article-body{ padding:0 2px; }
.article-p{ font-family:'Salavat','EB Garamond',serif; font-size:1.06rem; line-height:1.85; color:var(--ink); margin:0 0 18px; text-align:justify; text-align-last:left; }
.article-heading{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.28rem; color:var(--crimson-dark); margin:34px 0 14px; letter-spacing:.02em; }
.article-bullets, .article-numbered, .article-lettered{ margin:0 0 20px; padding-left:26px; }
.article-bullets li, .article-numbered li, .article-lettered li{ font-family:'Salavat','EB Garamond',serif; font-size:1.06rem; line-height:1.85; color:var(--ink); margin-bottom:12px; text-align:justify; text-align-last:left; }
.sigha-block{ background:var(--paper-card); border:1px solid var(--line); border-radius:14px; padding:22px 26px; margin:0 0 22px; }
.sigha-block-duz{ background:none; border:none; border-radius:0; padding:0; margin:0 0 16px; }
.sigha-translation{ font-family:'Salavat','EB Garamond',serif; font-size:1.02rem; line-height:1.8; color:var(--ink-soft); font-style:italic; text-align:justify; text-align-last:left; }
.inline-ar{ font-family:'Shaikh Hamdullah Mushaf','Scheherazade New', serif; font-size:1.2em; direction:rtl; unicode-bidi:embed; }
.ayet-mark{ color:var(--gold); font-weight:700; }
.article-image{ margin:20px 0; text-align:center; }
.article-image img{ max-width:100%; }
.article-image-caption{ font-family:'Salavat','Inter',sans-serif; font-size:12px; color:var(--ink-soft); margin-top:8px; font-style:italic; }
.inline-note{ text-align:center; margin:16px 0 4px; }
.inline-note .inline-ar{ font-size:1.3em; }
.inline-note-meaning{ text-align:center !important; font-style:italic; color:var(--ink-soft); margin:0 0 18px !important; }
.repeat-line{ font-family:'Salavat','EB Garamond',serif; font-style:italic; color:var(--gold); font-size:.9rem; text-align:center; margin-top:6px; }
.rt-label{ font-family:'Salavat','EB Garamond',serif; font-size:.92rem; color:var(--ink-soft); font-style:italic; text-align:left; margin:10px 0 4px; }
.rt-subtitle{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.05rem; color:var(--crimson); text-align:left; margin:16px 0 4px; padding-top:12px; border-top:1px dashed var(--line-soft); }
.rt-response{ margin-bottom:4px; }
.rt-response.rt-emphasis .arabic, .rt-response.rt-emphasis .tr-text{ font-weight:700; }
.rt-note{ font-family:'Salavat','EB Garamond',serif; font-style:italic; color:var(--ink-soft); font-size:.92rem; text-align:left; margin:8px 0 12px; }
.flow-note{ font-family:'Salavat','EB Garamond',serif; font-style:italic; color:var(--ink-soft); font-size:.92rem; margin-top:12px; text-align:justify; text-align-last:left; }
.flow-note.collapsed{ max-height:4.3em; overflow:hidden; position:relative; }
.flow-note.collapsed::after{ content:""; position:absolute; bottom:1.3em; left:0; right:0; height:1.8em; background:linear-gradient(transparent, var(--paper-card)); }
.note-list{ margin:0; padding-left:1.15em; }
.note-list li{ margin-bottom:.5em; }
.note-list li:last-child{ margin-bottom:0; }
.note-toggle{ display:block; margin-top:7px; font-family:'Salavat','Inter',sans-serif; font-size:11.5px; font-weight:600; color:var(--gold); background:none; border:none; cursor:pointer; padding:0; font-style:normal; }
.note-toggle:hover{ color:var(--crimson); }
.tr-pending-note{ font-family:'Salavat','Inter',sans-serif; font-size:12px; color:var(--ink-soft); font-style:italic; }
.info-paragraphs p{ margin:0 0 .9em; color:var(--ink); text-align:justify; text-align-last:left; }
.info-paragraphs p:last-child{ margin-bottom:0; }

/* kaynakça */
.kaynak-entry{ padding:16px 0; border-top:1px solid var(--line-soft); }
.kaynak-entry.flash{ background:var(--crimson-wash); margin:0 -20px; padding:16px 20px; border-radius:8px; }
.kaynak-entry:first-child{ border-top:none; }
.kaynak-body{ flex:1; }
.kaynak-head-row{ display:flex; justify-content:space-between; align-items:flex-start; gap:12px; margin-bottom:6px; }
.kaynak-title{ font-family:'Salavat','EB Garamond',serif; font-size:1.05rem; font-weight:600; color:var(--ink); }
.kaynak-kod-etiket{ font-family:'Salavat','Inter',sans-serif; font-size:11px; letter-spacing:.06em; color:var(--crimson-dark); flex:none; white-space:nowrap; }

.kaynak-view-btn{ font-family:'Salavat','Inter',sans-serif; font-size:11.5px; font-weight:600; color:var(--crimson-dark); background:none; border:1px solid var(--crimson); border-radius:100px; padding:4px 12px; cursor:pointer; }
.kaynak-view-btn:hover{ background:var(--crimson); color:#fff9ee; }
.lb-hata{ color:#f3e9d6; font-family:'Salavat','Inter',sans-serif; font-size:14px; padding:40px 20px; }
.ikon-btn.kaynak-ikon{ color:var(--gold-text); }
.ikon-btn.kaynak-ikon:hover{ color:var(--crimson-dark); border-color:var(--crimson); }
.kaynak-view-btn[disabled]{ opacity:.4; cursor:default; border-color:var(--line); color:var(--ink-soft); }

.contact-card{ background:var(--paper-card); border:1px solid var(--line); border-radius:16px; padding:36px 38px; box-shadow:var(--shadow); }
.contact-form{ margin-top:24px; display:flex; flex-direction:column; gap:16px; }
.form-field label{ display:block; font-family:'Salavat','Inter',sans-serif; font-size:12.5px; font-weight:600; letter-spacing:.03em; color:var(--ink-soft); margin-bottom:6px; }
.form-field input, .form-field textarea{
  width:100%; padding:12px 14px; border:1px solid var(--line); border-radius:10px;
  font-family:'Salavat','EB Garamond',serif; font-size:15.5px; background:var(--paper); color:var(--ink); resize:vertical;
}
.form-field input:focus, .form-field textarea:focus{ outline:2px solid var(--gold-soft); border-color:var(--gold); }
.form-submit-btn{
  align-self:flex-start; font-family:'Salavat','Inter',sans-serif; font-weight:600; font-size:14px; color:#fff9ee;
  background:var(--crimson); border:1px solid var(--crimson); border-radius:100px; padding:11px 26px; cursor:pointer; margin-top:4px;
}
.form-submit-btn:hover{ background:var(--crimson-dark); }
.form-note{ font-family:'Salavat','Inter',sans-serif; font-size:12.5px; color:var(--gold); font-style:italic; display:none; margin-top:2px; }
.form-note.show{ display:block; }
.contact-links{ margin-top:20px; display:flex; flex-direction:column; gap:12px; }
.contact-link{ display:flex; align-items:center; gap:12px; padding:14px 18px; border:1px solid var(--line); border-radius:12px; text-decoration:none; color:var(--ink); font-family:'Salavat','Inter',sans-serif; font-size:14.5px; font-weight:600; }
.contact-link:hover{ border-color:var(--crimson); background:var(--crimson-wash); color:var(--crimson-dark); }
.contact-link .ci{ font-size:1.3rem; }

.modal-overlay{ display:none; position:fixed; inset:0; background:rgba(20,12,8,.88); z-index:100; align-items:center; justify-content:center; padding:20px; backdrop-filter: blur(3px); }
.modal-overlay.open{ display:flex; }
.lightbox{ position:relative; max-width:720px; width:100%; display:flex; flex-direction:column; align-items:center; }
.lightbox-head{ display:flex; align-items:center; justify-content:space-between; width:100%; padding:0 6px 14px; color:#f3e9d6; }
.lightbox-head .lb-title{ font-family:'Salavat','Cormorant Garamond',serif; font-size:1.15rem; }
.lightbox-head .lb-count{ font-family:'Salavat','Inter',sans-serif; font-size:12px; opacity:.75; margin-top:2px; }
.lightbox-close{ background:rgba(255,255,255,.1); border:1px solid rgba(255,255,255,.25); border-radius:50%; width:36px; height:36px; color:#f3e9d6; font-size:16px; cursor:pointer; flex:none; }
.lightbox-close:hover{ background:rgba(255,255,255,.22); }
.lightbox-stage{ position:relative; width:100%; display:flex; align-items:center; justify-content:center; }
.lightbox-stage img{ max-width:100%; max-height:74vh; border-radius:8px; box-shadow:0 20px 60px rgba(0,0,0,.5); display:block; background:#efe6d3; }
.lb-nav{ position:absolute; top:50%; transform:translateY(-50%); background:rgba(20,12,8,.55); border:1px solid rgba(255,255,255,.3); color:#f3e9d6; width:46px; height:46px; border-radius:50%; font-size:20px; cursor:pointer; display:flex; align-items:center; justify-content:center; }
.lb-nav:hover{ background:rgba(138,28,42,.85); }
.lb-nav[disabled]{ opacity:.25; cursor:default; }
.lb-nav.lb-prev{ left:-8px; }
.lb-nav.lb-next{ right:-8px; }
.lb-dots{ display:flex; gap:6px; margin-top:16px; flex-wrap:wrap; justify-content:center; max-width:100%; }
.lb-dot{ width:8px; height:8px; border-radius:50%; background:rgba(255,255,255,.3); cursor:pointer; border:none; padding:0; }
.lb-dot.active{ background:#e7d7ab; }
@media (max-width:640px){
  .lb-nav.lb-prev{ left:4px; } .lb-nav.lb-next{ right:4px; }
  .lb-nav{ width:38px; height:38px; font-size:17px; }
}
.modal-close{ background:none; border:1px solid var(--line); border-radius:50%; width:32px; height:32px; font-size:16px; cursor:pointer; color:var(--ink-soft); flex:none; }
.modal-close:hover{ background:var(--crimson-wash); color:var(--crimson-dark); }

.site-footer{ text-align:center; padding:40px 20px 60px; color:var(--ink-soft); font-family:'Salavat','Inter',sans-serif; font-size:11.5px; border-top:1px solid var(--line); margin-top:50px; }

@media (max-width: 640px){
  .content{ padding:24px 16px 90px; }
  .hero-card, .contact-card{ padding:26px 20px; }
  .flow-surface{ padding:6px 18px; }
  .flow-entry.flash{ margin:0 -18px; padding:20px 18px; }
  .back-bar{ margin:-24px -16px 20px; padding:12px 16px; top:41px; }
  .arabic{ font-size:1.55rem; line-height:2.05; }
  .tr-text{ font-size:1.08rem; }
  .topnav{ padding:0 12px; }
  .topnav button{ padding:12px 11px; font-size:12.5px; }
}

/* ================= REVİZYON EKLERİ ================= */
:root{ --gold-text:#82632a; --on-accent:#fff9ee; --scroll-thumb:#d8c393; }
/* Karanlık mod: sistem ayarı veya kullanıcının seçimi */
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    color-scheme: dark;
    --ink:#ece3d3; --ink-soft:#b9ab97;
    --paper:#1a1410; --paper-card:#231b16; --paper-raised:#2a211b;
    --crimson:#b8474f; --crimson-dark:#eb9aa2; --crimson-wash:#3a1e21;
    --gold:#d1aa5c; --gold-soft:#5c4b2b; --gold-text:#d9b56a;
    --line:#3d3229; --line-soft:#2f261f; --info-bg:#271f19;
    --shadow: 0 10px 30px -12px rgba(0,0,0,0.6); --scroll-thumb:#5c4b2b;
  }
}
:root[data-theme="dark"]{
  color-scheme: dark;
  --ink:#ece3d3; --ink-soft:#b9ab97;
  --paper:#1a1410; --paper-card:#231b16; --paper-raised:#2a211b;
  --crimson:#b8474f; --crimson-dark:#eb9aa2; --crimson-wash:#3a1e21;
  --gold:#d1aa5c; --gold-soft:#5c4b2b; --gold-text:#d9b56a;
  --line:#3d3229; --line-soft:#2f261f; --info-bg:#271f19;
  --shadow: 0 10px 30px -12px rgba(0,0,0,0.6); --scroll-thumb:#5c4b2b;
}
:root[data-theme="light"]{ color-scheme: light; }
::-webkit-scrollbar-track{ background:var(--paper); }
::-webkit-scrollbar-thumb{ background:var(--scroll-thumb); border-color:var(--paper); }
html{ scrollbar-color:var(--scroll-thumb) var(--paper); }
.ozel-banner-uyari{ background:linear-gradient(135deg, var(--info-bg), var(--paper-raised)); }
.ozel-banner-uyari .ozel-banner-baslik{ color:var(--gold-text); }
.vakit-kutu.vakit-aktif .vakit-ad, .vakit-kutu.vakit-aktif .vakit-saat,
.etiket-chip-aktif, .lang-toggle button.active, .search-btn.active, .ana-banner{ color:var(--on-accent); }

/* Okunabilirlik: küçük altın yazıların kontrastı yükseltildi */
.eyebrow, .fihrist-row .fr-no, .fihrist-row .fr-title, .search-result .sr-vird,
.malumat-panel .m-head .toggle-txt, .note-toggle, .repeat-line, .form-note{ color:var(--gold-text); }
.fihrist-row:hover .fr-title{ color:var(--crimson-dark); }

/* Klavye ile gezinme */
[role="button"]{ cursor:pointer; }
:focus-visible{ outline:2px solid var(--gold); outline-offset:2px; border-radius:6px; }
.fihrist-row:focus-visible, .ana-kart:focus-visible, .ana-kart-vird-satir:focus-visible, .search-result:focus-visible{ outline-offset:-2px; }
.skip-link{ position:absolute; left:-9999px; top:8px; z-index:200; background:var(--crimson); color:var(--on-accent); padding:8px 14px; border-radius:8px; font-family:'Salavat','Inter',sans-serif; font-size:13px; }
.skip-link:focus{ left:8px; }

/* Üst çubuk araçları */
.topbar-tools{ display:flex; gap:8px; flex:none; }
.theme-btn svg{ display:block; }

/* Hazırlanıyor rozeti */
.hazir-degil-rozet{ display:inline-block; font-family:'Salavat','Inter',sans-serif; font-size:10px; font-weight:600; letter-spacing:.04em; text-transform:uppercase; color:var(--ink-soft); border:1px solid var(--line); border-radius:100px; padding:1px 8px; margin-left:8px; vertical-align:middle; white-space:nowrap; }
.ana-kart-vird-satir.hazir-degil{ opacity:.7; }
.fihrist-row .hazir-degil-rozet{ flex:none; margin-left:auto; }
.ana-kart-vird-satir{ display:flex; align-items:center; gap:6px; }
.ana-kart-vird-satir .hazir-degil-rozet{ flex:none; margin-left:auto; }

/* Tesbih sayacı */
.sayac-btn{ display:inline-flex; align-items:center; gap:6px; margin:8px auto 0; font-family:'Salavat','Inter',sans-serif; font-size:12px; font-weight:600; color:var(--crimson-dark); background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:5px 12px; cursor:pointer; user-select:none; -webkit-user-select:none; touch-action:manipulation; }
.sayac-btn:hover{ border-color:var(--crimson); }
.sayac-btn.tamam{ background:var(--crimson); color:var(--on-accent); border-color:var(--crimson); }
.sayac-btn .sayac-sifirla{ opacity:.7; font-weight:400; margin-left:4px; }
.sayac-wrap{ text-align:center; }

/* Konum / şehir seçimi */
.vakit-konum{ margin-top:10px; display:flex; justify-content:center; gap:8px; flex-wrap:wrap; align-items:center; font-family:'Salavat','Inter',sans-serif; font-size:12px; color:var(--ink-soft); }
.vakit-konum select, .vakit-konum button{ font-family:'Salavat','Inter',sans-serif; font-size:12px; color:var(--ink); background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:5px 10px; cursor:pointer; }
.vakit-konum button:hover, .vakit-konum select:hover{ border-color:var(--crimson); }

.site-footer .footer-not{ max-width:640px; margin:0 auto 10px; line-height:1.6; }
.noscript-uyari{ max-width:640px; margin:60px auto; padding:24px; text-align:center; font-family:'Salavat','Inter',sans-serif; }

@media (max-width:520px){
  .topbar{ padding:16px 16px 10px; gap:12px; }
  .topbar img.logo{ width:40px; height:40px; }
  .topbar h1{ font-size:1.18rem; line-height:1.25; }
  .topbar .tagline{ font-size:.76rem; line-height:1.35; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden; }
  .topbar-tools{ gap:6px; }
  .topbar-tools .search-btn{ width:36px; height:36px; }
  .global-search-panel{ padding:0 16px 16px; }
}
/* ---- Favori / paylaş / okundu ---- */
.vird-baslik-satir{ display:flex; align-items:flex-start; gap:12px; }
.vird-baslik-satir h2{ flex:1; }
.dua-aksiyon{ display:inline-flex; gap:4px; flex:none; margin-left:auto; }
.ikon-btn{ width:32px; height:32px; border-radius:50%; border:1px solid var(--line); background:var(--paper-card); color:var(--ink-soft); cursor:pointer; display:inline-flex; align-items:center; justify-content:center; padding:0; }
.ikon-btn:hover{ border-color:var(--crimson); color:var(--crimson-dark); }
.fav-btn svg path{ fill:none; stroke:currentColor; stroke-width:1.4; }
.fav-btn.aktif{ color:var(--gold); border-color:var(--gold); }
.fav-btn.aktif svg path{ fill:currentColor; }
.flow-head .dua-aksiyon{ align-self:center; }
.okundu-btn{ font-family:'Salavat','Inter',sans-serif; font-size:12.5px; font-weight:600; color:var(--crimson-dark); background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:7px 15px; cursor:pointer; }
.okundu-btn:hover{ border-color:var(--crimson); }
.okundu-btn.aktif{ background:var(--crimson); border-color:var(--crimson); color:var(--on-accent); }
.ana-kart-vird-satir.okundu{ color:var(--ink-soft); }
.okundu-isaret{ color:var(--crimson); font-weight:700; margin-right:6px; }
.ana-kart-not{ margin-top:8px; font-size:.85rem; font-style:italic; color:var(--ink-soft); }
.ana-kart-ek{ font-size:.9rem; color:var(--ink-soft); }
.ana-kart-devam{ border-left:4px solid var(--gold); }
.fav-satir{ align-items:center; }
.fav-ust{ display:block; font-family:'Salavat','Inter',sans-serif; font-size:11.5px; font-weight:500; color:var(--ink-soft); margin-top:2px; }
.yaklasan-satir{ display:grid; grid-template-columns:1fr auto; gap:0 12px; padding:8px 2px; border-bottom:1px solid var(--gold-soft); cursor:pointer; }
.yaklasan-satir:last-of-type{ border-bottom:none; }
.yaklasan-satir:hover .yaklasan-ad{ text-decoration:underline; }
.yaklasan-ad{ font-family:'Salavat','Cormorant Garamond',serif; font-size:1.08rem; font-weight:600; color:var(--crimson-dark); }
.yaklasan-kalan{ font-family:'Salavat','Inter',sans-serif; font-size:12px; font-weight:600; color:var(--gold-text); text-align:right; align-self:center; grid-row:span 2; }
.yaklasan-tarih{ font-size:.86rem; color:var(--ink-soft); }
.vakit-bilgi{ margin-top:10px; display:flex; justify-content:center; flex-wrap:wrap; gap:6px; font-family:'Salavat','Inter',sans-serif; font-size:12.5px; color:var(--ink-soft); }
.vakit-bilgi b{ color:var(--crimson-dark); font-weight:600; }
.footer-baglantilar{ margin-bottom:8px; display:flex; justify-content:center; gap:6px; flex-wrap:wrap; }
.footer-baglantilar a{ color:var(--ink-soft); }
.bildirim-kutusu{ position:fixed; left:50%; bottom:24px; transform:translate(-50%, 20px); opacity:0; pointer-events:none; z-index:300; max-width:min(92vw, 460px); background:var(--ink); color:var(--paper); font-family:'Salavat','Inter',sans-serif; font-size:13.5px; padding:11px 18px; border-radius:12px; box-shadow:var(--shadow); transition:opacity .2s, transform .2s; text-align:center; }
.bildirim-kutusu.goster{ opacity:1; transform:translate(-50%, 0); }

/* ---- Yazılar ve yorumlar ---- */
.tp-giris-kart{ background:var(--paper-card); border:1px solid var(--line); border-radius:16px; padding:26px 28px; box-shadow:var(--shadow); margin-bottom:16px; }
.tp-giris-kart .eyebrow{ display:block; margin-bottom:8px; }
.tp-giris-kart h2{ font-size:1.6rem; }

/* Arapça liste maddeleri kutu içinde */

/* Satır içi sayaç: küçük zikirmatik */
.sayac-wrap{ display:flex; justify-content:center; align-items:center; gap:8px; margin-top:10px; }
.sayac-btn{ position:relative; width:64px; height:64px; padding:0; border-radius:50%; border:none; background:var(--paper); box-shadow:0 2px 8px -3px rgba(60,30,20,.35), inset 0 0 0 1px var(--line); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; margin:0; color:var(--crimson-dark); user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.sayac-btn:hover{ box-shadow:0 2px 8px -3px rgba(60,30,20,.35), inset 0 0 0 1px var(--crimson); }
.sayac-halka{ position:absolute; inset:3px; width:calc(100% - 6px); height:calc(100% - 6px); transform:rotate(-90deg); }
.sayac-halka circle{ fill:none; stroke-width:3; }
.sh-arka{ stroke:var(--gold-soft); }
.sh-on{ stroke:var(--crimson); stroke-linecap:round; transition:stroke-dashoffset .25s ease; }
.sayac-deger{ position:relative; display:flex; flex-direction:column; align-items:center; line-height:1; font-family:'Salavat','Inter',sans-serif; }
.sayac-deger b{ font-size:17px; font-weight:700; }
.sayac-deger small{ font-size:10px; color:var(--ink-soft); margin-top:2px; }
.sayac-btn.tamam{ background:var(--crimson); color:var(--on-accent); }
.sayac-btn.tamam .sayac-deger small{ color:var(--on-accent); opacity:.85; }
.sayac-btn.tamam .sh-on{ stroke:var(--gold); }
.sayac-btn.vurus, .zk-daire.vurus{ animation:vurus .18s ease; }
@keyframes vurus{ 50%{ transform:scale(.94); } }
.sayac-sifirla{ width:30px; height:30px; border-radius:50%; border:1px solid var(--line); background:var(--paper-card); color:var(--ink-soft); cursor:pointer; font-size:15px; line-height:1; }
.sayac-sifirla:hover{ color:var(--crimson-dark); border-color:var(--crimson); }

/* Zikirmatik penceresi */
.zk-arka{ position:fixed; inset:0; z-index:160; background:rgba(20,12,8,.6); display:flex; align-items:center; justify-content:center; padding:16px; backdrop-filter:blur(2px); }
.zk-pencere{ width:100%; max-width:420px; max-height:94vh; overflow:auto; background:var(--paper-card); border:1px solid var(--line); border-radius:22px; box-shadow:0 20px 60px rgba(0,0,0,.35); padding:16px 20px 18px; text-align:center; }

.zk-cip{ flex:none; font-family:'Salavat','Inter',sans-serif; font-size:12px; font-weight:600; color:var(--crimson-dark); background:var(--paper); border:1px solid var(--line); border-radius:100px; padding:6px 12px; cursor:pointer; }

.zk-zikir{ margin:12px 0 6px; min-height:64px; }
.zk-ar{ font-family:'Shaikh Hamdullah Mushaf','Scheherazade New',serif; font-size:1.9rem; line-height:1.9; color:var(--ink); }
.zk-ad{ font-family:'Salavat','EB Garamond',serif; font-style:italic; color:var(--ink-soft); }
.zk-daire{ position:relative; width:min(68vw, 240px); aspect-ratio:1; margin:8px auto 14px; display:flex; align-items:center; justify-content:center; border-radius:50%; border:none; cursor:pointer; color:var(--crimson-dark);
  background:radial-gradient(circle at 50% 38%, var(--paper-raised), var(--paper) 70%); box-shadow:0 14px 30px -14px rgba(60,30,20,.45), inset 0 0 0 1px var(--line), inset 0 -6px 14px -8px rgba(60,30,20,.25);
  user-select:none; -webkit-user-select:none; touch-action:manipulation; -webkit-tap-highlight-color:transparent; }
.zk-halka{ position:absolute; inset:8px; width:calc(100% - 16px); height:calc(100% - 16px); transform:rotate(-90deg); }

.zk-halka-arka{ stroke:var(--gold-soft); }
.zk-halka-on{ stroke:var(--crimson); stroke-linecap:round; transition:stroke-dashoffset .25s ease; }

.zk-ic{ position:relative; display:flex; flex-direction:column; align-items:center; line-height:1.05; }
.zk-sayi{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:4rem; }
.zk-hedef{ font-family:'Salavat','Inter',sans-serif; font-size:13px; color:var(--ink-soft); margin-top:2px; }
.zk-dokun{ font-family:'Salavat','Inter',sans-serif; font-size:10.5px; letter-spacing:.12em; text-transform:uppercase; color:var(--gold-text); margin-top:8px; }
.zk-serbest-hedef{ display:flex; gap:8px; align-items:center; justify-content:center; margin-bottom:10px; font-family:'Salavat','Inter',sans-serif; font-size:12.5px; color:var(--ink-soft); }

.zk-serbest-hedef input{ width:110px; padding:7px 10px; border:1px solid var(--line); border-radius:10px; background:var(--paper); color:var(--ink); }
.zk-alt{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; }
.zk-toplam{ margin-top:10px; }
.ana-kart-zikir{ display:flex; align-items:center; gap:14px; }
.ana-zikir-ikon{ width:46px; height:46px; flex:none; border-radius:50%; background:var(--crimson-wash); color:var(--crimson-dark); display:inline-flex; align-items:center; justify-content:center; }

/* Sesli odalar */
.sohbet-grup-baslik{ font-family:'Salavat','Inter',sans-serif; font-size:12px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--gold-text); margin:26px 2px 10px; }
.sohbet-oda-kart.sesli .sohbet-oda-ikon{ background:var(--crimson); color:var(--on-accent); }
.sesli-kisiler{ display:grid; grid-template-columns:repeat(auto-fill, minmax(118px, 1fr)); gap:14px; padding:18px 10px; margin:0 -8px 14px; background:var(--paper); border:1px solid var(--line-soft); border-radius:14px; min-height:150px; align-content:start; }
.sesli-kisiler .tp-bos{ grid-column:1/-1; }
.sesli-kisi{ display:flex; flex-direction:column; align-items:center; gap:6px; text-align:center; min-width:0; }
.sesli-avatar{ --seviye:0; position:relative; width:64px; height:64px; border-radius:50%; background:var(--crimson-wash); color:var(--crimson-dark); display:flex; align-items:center; justify-content:center; font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.6rem;
  box-shadow:0 0 0 calc(2px + var(--seviye) * 7px) color-mix(in srgb, var(--gold) calc(25% + var(--seviye) * 60%), transparent); transition:box-shadow .15s; }
.sesli-mik-rozet{ position:absolute; right:-2px; bottom:-2px; width:24px; height:24px; border-radius:50%; background:var(--paper-card); border:1px solid var(--line); display:flex; align-items:center; justify-content:center; color:var(--crimson-dark); }
.sesli-mik-rozet svg{ width:14px; height:14px; }
.sesli-kisi.sessiz .sesli-mik-rozet{ color:var(--ink-soft); }
.sesli-isim{ font-family:'Salavat','Inter',sans-serif; font-size:13px; font-weight:600; color:var(--ink); max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
.sesli-durum{ font-size:11px; }
.sesli-kontrol{ display:flex; flex-wrap:wrap; gap:10px; align-items:center; justify-content:center; }
.sesli-kontrol .tp-btn{ display:inline-flex; align-items:center; gap:8px; }
.sesli-mik.acik{ background:var(--crimson); border-color:var(--crimson); color:var(--on-accent); }
.tp-tehlike-btn{ color:var(--crimson-dark); }
.sesli-not{ text-align:center; margin-top:10px; min-height:1em; }
@media (max-width:520px){ .sesli-kisiler{ grid-template-columns:repeat(3, 1fr); gap:10px; } .sesli-avatar{ width:54px; height:54px; font-size:1.35rem; } }

/* Uygulamayı indir */
.uyg-dugmeler{ display:flex; flex-wrap:wrap; gap:10px; margin-top:12px; }
.uyg-dugme{ flex:1 1 180px; display:flex; align-items:center; gap:12px; text-align:left; padding:11px 16px; border-radius:14px; border:1px solid var(--crimson); background:var(--paper-card); color:var(--crimson-dark); cursor:pointer; font:inherit; }

.uyg-kart-metin{ font-size:.95rem; color:var(--ink-soft); }
.uygulama-kart{ grid-column:1/-1; }
.uyg-giris{ display:flex; gap:18px; align-items:flex-start; }
.uyg-logo{ border-radius:18px; flex:none; box-shadow:0 6px 16px -8px rgba(40,20,10,.4); }
.uyg-yuklu{ color:var(--crimson-dark); font-weight:600; }
.uyg-bolum{ background:var(--paper-card); border:1px solid var(--line); border-radius:16px; padding:18px 22px; margin:16px 0; scroll-margin-top:90px; }

.uyg-bolum h3{ display:flex; align-items:center; gap:10px; margin:0 0 10px; color:var(--crimson-dark); }

.uyg-bolum li{ margin:6px 0; line-height:1.6; }

.cevrimdisi-serit{ position:fixed; left:0; right:0; bottom:0; z-index:130; background:var(--ink); color:var(--paper); font-family:'Salavat','Inter',sans-serif; font-size:12.5px; text-align:center; padding:8px 14px; }
@media (max-width:520px){ .uyg-giris{ flex-direction:column; align-items:center; text-align:center; } .uyg-dugme{ flex-basis:100%; } }

/* Kur'ân dinleme */
.kuran-kariler{ display:grid; grid-template-columns:repeat(3, minmax(0,1fr)); gap:10px; margin:0 0 6px; }
.kari-kart{ display:flex; flex-direction:column; align-items:center; gap:2px; text-align:center; padding:10px 10px 9px; border:1px solid var(--line); border-radius:14px; background:var(--paper-card); cursor:pointer; color:var(--ink); font:inherit; transition:border-color .15s, background .15s; }

@media (max-width:640px){ .kuran-kariler{ gap:6px; } .kari-kart{ padding:8px 4px; border-radius:12px; } .kari-kart .kari-ad{ font-size:.9rem; } .kari-kart .kari-not{ font-size:10px; } }

.kuran-dinle .arac-btn.aktif{ background:var(--crimson); border-color:var(--crimson); color:var(--on-accent); }

.ayet-dinle-btn{ background:none; border:none; padding:0; cursor:pointer; font:inherit; color:inherit; }
.ayet-dinle-btn:hover{ color:var(--crimson); text-decoration:underline; }
.flow-entry.okunan-ayet{ background:var(--crimson-wash); box-shadow:0 0 0 12px var(--crimson-wash); border-radius:4px; transition:background .3s; }
.kuran-oynatici{ position:fixed; left:50%; bottom:14px; transform:translateX(-50%); z-index:120; width:min(560px, calc(100% - 24px)); background:var(--paper-card); border:1px solid var(--line); border-radius:18px; box-shadow:0 16px 40px -12px rgba(30,15,10,.45); padding:10px 14px 10px; font-family:'Salavat','Inter',sans-serif; }
.ko-ust{ display:flex; gap:8px; align-items:baseline; min-width:0; margin-bottom:6px; }
.ko-kari{ flex:none; font-size:11px; font-weight:700; letter-spacing:.06em; text-transform:uppercase; color:var(--gold-text); }
.ko-yer{ font-size:12.5px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
.ko-ilerleme{ display:flex; align-items:center; gap:8px; margin-bottom:6px; }
.ko-ilerleme input{ flex:1; accent-color:var(--crimson); }
.ko-zaman{ font-size:11.5px; color:var(--ink-soft); white-space:nowrap; font-variant-numeric:tabular-nums; }
.ko-alt{ display:flex; align-items:center; gap:6px; }
.ko-btn{ width:38px; height:38px; flex:none; border-radius:50%; border:1px solid var(--line); background:var(--paper); color:var(--crimson-dark); display:inline-flex; align-items:center; justify-content:center; cursor:pointer; font-size:13px; }
.ko-btn:hover{ border-color:var(--crimson); }
.ko-ana{ width:46px; height:46px; background:var(--crimson); border-color:var(--crimson); color:var(--on-accent); }
.ko-bosluk{ flex:1; }
.ko-not{ font-size:11.5px; color:var(--ink-soft); margin-top:4px; }

body.kuran-oynatici-acik .content{ padding-bottom:170px; }
@media print{ .kuran-oynatici, .kuran-dinle{ display:none !important; } }

/* Virdlerde büyük bölüm başlığı */
.flow-bolum-title{ text-align:center; margin:30px 0 4px; padding:14px 0; border-top:3px double var(--gold-soft); border-bottom:3px double var(--gold-soft); }
.flow-bolum-title:first-child{ margin-top:8px; }
.flow-bolum-title span{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.35rem; letter-spacing:.12em; color:var(--crimson-dark); }
.flow-bolum-title + .flow-section-title{ border-top:none; }
@media (max-width:520px){ .flow-bolum-title span{ font-size:1.12rem; letter-spacing:.06em; } }

/* Ana sayfa: vaktin virdi kısayolu */
.vakit-vird{ flex-basis:100%; display:inline-flex; align-items:center; justify-content:center; flex-wrap:wrap; gap:6px 8px; margin-top:8px; padding:9px 14px; border-radius:12px; background:var(--crimson-wash); border:1px solid var(--crimson); color:var(--crimson-dark); text-decoration:none; }
.vakit-vird:hover{ background:var(--crimson); color:var(--on-accent); }

.vakit-vird-etiket{ font-size:10.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; opacity:.85; }
.vakit-vird-ad{ font-family:'Salavat','Cormorant Garamond',serif; font-size:1.05rem; font-weight:700; }

/* Yaklaşan günler: kalan gün sağda */
.yaklasan-satir{ grid-template-columns:1fr auto; grid-template-areas:"ad kalan" "tarih kalan"; align-items:center; }
.yaklasan-ad{ grid-area:ad; }
.yaklasan-tarih{ grid-area:tarih; text-align:left; }
.yaklasan-kalan{ grid-area:kalan; justify-self:end; white-space:nowrap; background:var(--info-bg); border:1px solid var(--gold-soft); border-radius:100px; padding:4px 11px; }

/* Evrâd & Zikirler sekmeleri */
.evrad-sekmeler{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 20px; }
.evrad-sekme{ display:inline-flex; align-items:center; gap:8px; font-family:'Salavat','Inter',sans-serif; font-size:13px; font-weight:600; color:var(--crimson-dark); background:var(--paper-card); border:1px solid var(--line); border-radius:100px; padding:8px 16px; cursor:pointer; }
.evrad-sekme:hover{ border-color:var(--crimson); }
.evrad-sekme.aktif{ background:var(--crimson); border-color:var(--crimson); color:var(--on-accent); }
.evrad-sekme-sayi{ font-size:10.5px; font-weight:500; opacity:.75; }
@media (max-width:520px){ .evrad-sekmeler{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; margin-right:-16px; padding-right:16px; } .evrad-sekme{ flex:none; } }

/* Gelişmiş arama */
.arama-bas{ display:flex; align-items:baseline; gap:10px; flex-wrap:wrap; margin-bottom:8px; }
.global-search-panel .fihrist-search{ margin-bottom:12px; }
.arama-filtre{ margin-bottom:10px; }
.arama-filtre-ad{ display:block; font-family:'Salavat','Inter',sans-serif; font-size:11px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--ink-soft); margin-bottom:6px; }
.arama-cipler{ display:flex; gap:6px; flex-wrap:wrap; }
.arama-cipler .etiket-chip{ padding:5px 12px; font-size:12px; }
@media (max-width:520px){ .arama-cipler{ flex-wrap:nowrap; overflow-x:auto; scrollbar-width:none; } .arama-cipler .etiket-chip{ flex:none; } }

@media print{ .zk-arka, .sayac-wrap{ display:none !important; } .flow-surface.kitap::before{ display:none; } }

/* ================= SOHBET ODALARI VE PROFİL ================= */
.cevrimici-nokta{ display:inline-block; width:8px; height:8px; border-radius:50%; background:#3f9b5a; box-shadow:0 0 0 3px rgba(63,155,90,.18); margin-right:6px; vertical-align:middle; }
.sohbet-odalar{ display:flex; flex-direction:column; gap:10px; }
.sohbet-oda-kart{ display:flex; align-items:center; gap:14px; width:100%; text-align:left; background:var(--paper-card); border:1px solid var(--line); border-radius:14px; padding:14px 18px; cursor:pointer; color:var(--ink); font:inherit; }
.sohbet-oda-kart:hover{ border-color:var(--crimson); }
.sohbet-oda-ikon{ width:42px; height:42px; flex:none; border-radius:12px; background:var(--crimson-wash); color:var(--crimson-dark); display:inline-flex; align-items:center; justify-content:center; font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.3rem; }
.sohbet-oda-govde{ flex:1; min-width:0; display:flex; flex-direction:column; }
.sohbet-oda-ad{ font-family:'Salavat','Cormorant Garamond',serif; font-weight:700; font-size:1.15rem; color:var(--crimson-dark); }
.sohbet-oda-aciklama{ font-size:.92rem; color:var(--ink-soft); }
.sohbet-oda-son{ font-family:'Salavat','Inter',sans-serif; font-size:12px; color:var(--ink-soft); white-space:nowrap; overflow:hidden; text-overflow:ellipsis; margin-top:2px; }
.sohbet-oda-satir{ display:flex; flex-direction:column; padding:8px 2px; border-bottom:1px solid var(--gold-soft); cursor:pointer; min-width:0; }
.sohbet-oda-satir:last-child{ border-bottom:none; }
.sohbet-oda-satir:hover .sohbet-oda-ad{ text-decoration:underline; }
.sohbet-cevrimici{ float:right; text-transform:none; letter-spacing:0; font-size:12px; }
.sohbet-oda{ background:var(--paper-card); border:1px solid var(--line); border-radius:16px; padding:20px 22px; box-shadow:var(--shadow); }

.sohbet-bas{ margin-bottom:14px; }
.sohbet-mesajlar{ height:min(58vh, 560px); overflow-y:auto; display:flex; flex-direction:column; gap:10px; padding:14px 10px; margin:0 -8px; background:var(--paper); border:1px solid var(--line-soft); border-radius:14px; overscroll-behavior:contain; }

.sohbet-mesaj{ display:flex; gap:8px; align-items:flex-end; max-width:86%; }

.sohbet-metin p{ margin:2px 0 0; font-size:1.02rem; line-height:1.55; overflow-wrap:anywhere; }
.sohbet-alt{ display:flex; gap:10px; align-items:center; justify-content:space-between; margin-top:4px; }

.tp-isim{ font-family:'Salavat','Inter',sans-serif; font-size:12.5px; font-weight:700; color:var(--crimson-dark); text-decoration:none; }

.sohbet-yaz{ display:flex; gap:8px; align-items:flex-end; margin-top:12px; }

@media (prefers-reduced-motion: reduce){ *{ scroll-behavior:auto !important; transition:none !important; } }

let _bildirimZaman = null;
function bildirimGoster(mesaj){
  let n = document.getElementById('bildirimKutusu');
  if(!n){ n = document.createElement('div'); n.id = 'bildirimKutusu'; n.className = 'bildirim-kutusu'; n.setAttribute('role','status'); n.setAttribute('aria-live','polite'); document.body.appendChild(n); }

/* Paylaş: telefonda paylaşım menüsü, bilgisayarda bağlantıyı kopyalar */
async function paylas(yol, baslik){
  const url = location.href.split('#')[0] + '#/' + yol;
  const metin = duzMetin(baslik) + ' — Evrâd-ı Mahmûdiyye Külliyâtı';
  if(navigator.share){
    try{ await navigator.share({title: duzMetin(baslik), text: metin, url}); return; }
    catch(e){ if(e && e.name==='AbortError') return; }
  }
  try{ await navigator.clipboard.writeText(metin + '\n' + url); bildirimGoster('Bağlantı kopyalandı.'); }
  catch(e){ window.prompt('Bağlantıyı kopyalayın:', url); }
}

/* Favoriler: [{yol, baslik, ust, t}] */
function favoriler(){ return jsonOku('em_favoriler', []); }
function favoriMi(yol){ return favoriler().some(f=>f.yol===yol); }
function favoriDegistir(yol, baslik, ust){
  let l = favoriler();
  const vardi = l.some(f=>f.yol===yol);
  l = vardi ? l.filter(f=>f.yol!==yol) : [{yol, baslik:duzMetin(baslik), ust:duzMetin(ust||''), t:Date.now()}].concat(l);
  jsonYaz('em_favoriler', l);
  bildirimGoster(vardi ? 'Favorilerden çıkarıldı.' : 'Favorilere eklendi.');
  return !vardi;
}

  const f = e.target.closest && e.target.closest('[data-fav]');
  if(f){

/* Okuma takibi: hangi virdler hangi gün okundu ({ 'YYYY-AA-GG': [anahtar,...] }) */
function tarihAnahtari(d){ return d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0'); }
function okunanlar(){ return jsonOku('em_okunan', {}); }
function bugunOkunduMu(key){ return (okunanlar()[tarihAnahtari(new Date())]||[]).includes(key); }
function okunduDegistir(key){
  const o = okunanlar(), t = tarihAnahtari(new Date()), l = o[t] || [];
  const i = l.indexOf(key);
  if(i>=0) l.splice(i,1); else l.push(key);
  o[t] = l;
  const gunler = Object.keys(o).sort(); while(gunler.length > 90) delete o[gunler.shift()];
  jsonYaz('em_okunan', o);
  return i<0;
}
function seriGunSayisi(){
  const o = okunanlar(); const d = new Date(); let n = 0;
  if(!(o[tarihAnahtari(d)]||[]).length) d.setDate(d.getDate()-1);
  while((o[tarihAnahtari(d)]||[]).length){ n++; d.setDate(d.getDate()-1); }
  return n;
}

let _konumIzleyici = null;
function okumaKonumunuIzle(yol, baslik, key){
  window.removeEventListener('scroll', _konumIzleyici);
  let zaman = null;
  _konumIzleyici = ()=>{
    clearTimeout(zaman);
    zaman = setTimeout(()=>{
      if(!location.hash.startsWith('#/'+yol)) { window.removeEventListener('scroll', _konumIzleyici); return; }
      const girdiler = document.querySelectorAll('.flow-entry[id^="entry-'+key+'-"]');
      let idx = undefined;
      for(const g of girdiler){ if(g.getBoundingClientRect().bottom > 90){ idx = Number(g.id.split('-').pop()); break; } }
      sonOkunanKaydet(yol, baslik, idx);
    }, 800);
  };
  window.addEventListener('scroll', _konumIzleyici, {passive:true});
}

/* ================= ADRES YÖNLENDİRME (#/bolum/no) =================
   Her sayfanın kendi adresi olur: tarayıcının geri tuşu çalışır, bir duânın linki paylaşılabilir.
   Örnekler: #/muhtelif/33  ·  #/muhtelif/33/2 (3. duâya kaydırır)  ·  #/kuran/36  ·  #/kaynakca/kod/A01 */
let rotaIsleniyor = false;
let sonIslenenRota = null;
function setRoute(yol){
  const hedef = '#/' + yol;
  setTimeout(()=>{ if(typeof EkranAcik!=='undefined') EkranAcik.uygula(); }, 0);
  if(typeof KuranDinle!=='undefined') KuranDinle.rotaDegisti(yol);
  sonIslenenRota = hedef;
  if(location.hash === hedef) return;
  try{
    if(rotaIsleniyor) history.replaceState(null, '', hedef);
    else history.pushState(null, '', hedef);
  }catch(e){ /* file:// gibi ortamlarda history kullanılamazsa sessizce geç */ }
}
function itemYolu(item){
  const grp = FIHRIST.find(g=>g.items.some(i=>i.no===item.no));
  return (grp ? grp.groupKey : 'muhtelif') + '/' + item.no;
}
function route(){
  rotaIsleniyor = true;
  try{
    const parca = location.hash.replace(/^#\/?/, '').split('/').filter(Boolean).map(decodeURIComponent);
    const bolum = parca[0] || 'anasayfa';
    if(!['yazilar','sohbet','profil','uye'].includes(bolum)) Topluluk.temizle();
    if(GROUP_KEYS.includes(bolum) && parca[1]){
      const item = FIHRIST.flatMap(s=>s.items).find(i=>i.no===Number(parca[1]));
      if(!item){ goSection(bolum); return; }
      activeSection = bolum; buildTopnav(); closeGlobalSearch();
      if(!item.ready || !MASTER_DATA[item.key]) renderNotReady(item, bolum);
      else { kulliyatVird = item.key; renderVirdContent(item, parca[2]!==undefined ? Number(parca[2]) : undefined); }
      return;
    }
    if(bolum==='kuran' && parca[1]){
      const s = QURAN_DATA.surahs.find(x=>x.no===Number(parca[1]));
      activeSection = 'kuran'; buildTopnav(); closeGlobalSearch();
      if(s) renderSurah(s); else renderKuran();
      return;
    }
    if(bolum==='kaynakca' && parca[1]==='kod' && parca[2]){ gotoKaynakcaEntry(parca[2]); return; }
    if(bolum==='yazilar' && parca[1]){
      activeSection = 'yazilar'; buildTopnav(); closeGlobalSearch();
      Topluluk.renderYazi(parca[1]);
      return;
    }
    if(bolum==='gizlilik' || bolum==='uygulama'){ goSection(bolum); return; }
    if(bolum==='sohbet' || bolum==='profil' || bolum==='uye'){
      activeSection = 'yazilar'; buildTopnav(); closeGlobalSearch();
      if(bolum==='sohbet') (parca[1] ? Topluluk.renderOda(parca[1]) : Topluluk.renderSohbetListe());
      else if(bolum==='profil') Topluluk.renderProfil();
      else if(parca[1]) Topluluk.renderProfil(parca[1]); else Topluluk.renderProfil();
      return;
    }
    if(bolum==='kaynakca' && parca[1]){
      const item = FIHRIST.flatMap(s=>s.items).find(i=>i.no===Number(parca[1]));
      activeSection = 'kaynakca'; buildTopnav(); closeGlobalSearch();
      if(item && item.ready && MASTER_DATA[item.key]){ kaynakcaVird = item.key; renderVirdKaynakca(item); }
      else if(item) renderNotReady(item, 'kaynakca');
      else renderKaynakcaFihrist();
      return;
    }
    goSection((SECTIONS.some(s=>s.key===bolum) || GROUP_KEYS.includes(bolum) || bolum==='gizlilik') ? bolum : 'anasayfa');
  } finally {
    rotaIsleniyor = false;
  }
}

  nav.querySelectorAll('button').forEach(b=> b.onclick = ()=> goSection(b.dataset.key));

const GROUP_KEYS = ['gunluk','haftalik','aylik','muhtelif'];
function goSection(key){
  activeSection = key;
  buildTopnav();
  closeGlobalSearch();
  if(key!=='yazilar') Topluluk.temizle();
  setRoute(key==='anasayfa' ? '' : key);
  if(key==='anasayfa') renderAnaSayfa();
  else if(key==='hakkinda') renderHakkinda();

  else if(key==='iletisim') renderIletisim();

/* ================= TAKVİM & VAKİT HESABI ================= */
// Diyanet'in resmi ilanıyla fark çıkarsa bu sayıyı ayarla (gün cinsinden, + ileri / - geri)
const HICRI_DUZELTME = 1; // 13 Ağustos 2026'da gerçek Ru'yet ile fark tespit edildi, düzeltildi

const HICRI_AYLAR = ["Muharrem","Safer","Rabîulevvel","Rabîulâhır","Cemâziyelevvel","Cemâziyelâhır","Recep","Şa'bân","Ramazan","Şevvâl","Zülka'de","Zülhicce"];
const MILADI_AYLAR = ["Ocak","Şubat","Mart","Nisan","Mayıs","Haziran","Temmuz","Ağustos","Eylül","Ekim","Kasım","Aralık"];
const GUN_ISIMLERI = ["Pazar","Pazartesi","Salı","Çarşamba","Perşembe","Cuma","Cumartesi"];

// Tabular İslami takvim (astronomik ortalama), Julian Day üzerinden
function gregorianToJD(y,m,d){
  const a = Math.floor((14-m)/12), yy = y+4800-a, mm = m+12*a-3;
  return d + Math.floor((153*mm+2)/5) + 365*yy + Math.floor(yy/4) - Math.floor(yy/100) + Math.floor(yy/400) - 32045;
}
// DİYANET AY BAŞLANGIÇLARI (önerilen yöntem):
// Diyanet'in "Dinî Günler / Hicrî Takvim" ilanındaki her hicrî ayın 1. gününün MİLÂDÎ tarihini buraya girin.
// Anahtar "hicriYıl-ay", değer "YYYY-AA-GG". Bir tarih bu tablodaki bir ayın içine düşüyorsa (en fazla 30 gün)
// hesap yerine doğrudan bu tablo kullanılır; tablo dışında kalan tarihlerde yukarıdaki HICRI_DUZELTME'li hesap devreye girer.
// Örnek:  "1448-6": "2026-11-12",   "1448-7": "2026-12-12",
const HICRI_AY_BASLANGICLARI = {
};
const _HICRI_TABLO = Object.keys(HICRI_AY_BASLANGICLARI).map(k=>{
  const [hy,hm] = k.split('-').map(Number);
  const [gy,gm,gd] = HICRI_AY_BASLANGICLARI[k].split('-').map(Number);
  return {y:hy, m:hm, jd:gregorianToJD(gy,gm,gd)};
}).sort((a,b)=>a.jd-b.jd);
function hicriTablodan(jd){
  for(let i=_HICRI_TABLO.length-1; i>=0; i--){
    const t = _HICRI_TABLO[i];
    if(jd < t.jd) continue;
    const sonraki = _HICRI_TABLO[i+1];
    const ardisik = sonraki && ((sonraki.y===t.y && sonraki.m===t.m+1) || (sonraki.y===t.y+1 && t.m===12 && sonraki.m===1));
    const gun = jd - t.jd + 1;
    if(ardisik ? jd < sonraki.jd : gun <= 29) return {y:t.y, m:t.m, d:gun};
    return null;
  }
  return null;
}
function hicriFromJD(jd){
  const tablo = hicriTablodan(Math.floor(jd));
  if(tablo) return tablo;
  jd = Math.floor(jd) + HICRI_DUZELTME;
  const l = jd - 1948440 + 10632;
  const n = Math.floor((l-1)/10631);
  let l2 = l - 10631*n + 354;
  const j = (Math.floor((10985-l2)/5316))*(Math.floor((50*l2)/17719)) + (Math.floor(l2/5670))*(Math.floor((43*l2)/15238));
  l2 = l2 - (Math.floor((30-j)/15))*(Math.floor((17719*j)/50)) - (Math.floor(j/16))*(Math.floor((15238*j)/43)) + 29;
  const m = Math.floor((24*l2)/709);
  const d = l2 - Math.floor((709*m)/24);
  const y = 30*n + j - 30;
  return {y, m, d};
}
function bugununHicrisi(){
  const now = new Date();
  const jd = gregorianToJD(now.getFullYear(), now.getMonth()+1, now.getDate());
  return hicriFromJD(jd);
}

// Hicri -> JD (hicriFromJD'nin kesin tersi; hicriFromJD'yi referans alıp arayarak bulur,
// böylece iki fonksiyon arasında formül tutarsızlığı riski kalmaz)
function hicriToJD(y,m,d){
  const est = Math.round((y-1)*354.367 + Math.ceil(29.5*(m-1)) + d + 1948439.5 - HICRI_DUZELTME);
  for(let delta=-5; delta<=5; delta++){
    const jd = est+delta, h = hicriFromJD(jd);
    if(h.y===y && h.m===m && h.d===d) return jd;
  }
  for(let delta=-45; delta<=45; delta++){
    const jd = est+delta, h = hicriFromJD(jd);
    if(h.y===y && h.m===m && h.d===d) return jd;
  }
  return est;
}
function jdToGregorianDate(jd){
  jd = Math.round(jd);
  const a = jd + 32044;
  const b = Math.floor((4*a+3)/146097);
  const c = a - Math.floor((146097*b)/4);
  const dd = Math.floor((4*c+3)/1461);
  const e = c - Math.floor((1461*dd)/4);
  const mm = Math.floor((5*e+2)/153);
  const day = e - Math.floor((153*mm+2)/5) + 1;
  const month = mm + 3 - 12*Math.floor(mm/10);
  const year = 100*b + dd - 4800 + Math.floor(mm/10);
  return new Date(year, month-1, day);
}
// Verilen hicri ayın kaç gün çektiğini (29/30) bulur
function hicriAyUzunlugu(y,m){
  const jd1 = hicriToJD(y,m,1);
  const jd2 = (m===12) ? hicriToJD(y+1,1,1) : hicriToJD(y,m+1,1);
  return jd2 - jd1;
}
// Verilen hicri ay içinde, belirtilen haftanın gününe (0=Pazar..6=Cumartesi) denk gelen
// İLK hicri günü bulur (miladi karşılığının haftanın günü üzerinden)
function hicriAyIlkHaftaGunu(y,m,hedefGun){
  const uzunluk = hicriAyUzunlugu(y,m);
  for(let d=1; d<=uzunluk; d++){
    const wd = jdToGregorianDate(hicriToJD(y,m,d)).getDay();
    if(wd===hedefGun) return d;
  }
  return null;
}
function hicriAySonHaftaGunu(y,m,hedefGun){
  const uzunluk = hicriAyUzunlugu(y,m);
  for(let d=uzunluk; d>=1; d--){
    const wd = jdToGregorianDate(hicriToJD(y,m,d)).getDay();
    if(wd===hedefGun) return d;
  }
  return null;
}

// Mağrib vaktine göre "şu an geçerli olan" hicri tarih — takvim şeridi, kandil/bayram
// kontrolleri ve ayın mecmuası dahil HER YERDE bu merkezi fonksiyon kullanılır.
function efektifHicriTarih(){
  const now = new Date();
  const jd = gregorianToJD(now.getFullYear(), now.getMonth()+1, now.getDate());
  const koordinat = AKTIF_KOORDINAT || ISTANBUL_KOORDINAT;
  const v = vakitHesapla(koordinat.lat, koordinat.lon, now, aktifTz());
  const cur = now.getHours() + now.getMinutes()/60;
  if(v._aksamH!==null && cur >= v._aksamH){
    return hicriFromJD(jd+1);
  }
  return hicriFromJD(jd);
}

// Teşrik tekbirleri: Zülhicce 9 (Arefe) sabah namazından, Zülhicce 13 ikindi namazına kadar
function tesrikTekbirDurumu(h){
  if(h.m !== 12) return false;
  if(h.d > 9 && h.d < 13) return true;
  if(h.d !== 9 && h.d !== 13) return false;
  const koordinat = AKTIF_KOORDINAT || ISTANBUL_KOORDINAT;
  const now = new Date();
  const v = vakitHesapla(koordinat.lat, koordinat.lon, now, aktifTz());
  const cur = now.getHours() + now.getMinutes()/60;
  if(h.d === 9) return v._imsakH===null ? true : cur >= v._imsakH;
  return v._ikindiH===null ? true : cur <= v._ikindiH;
}

// Namaz vakitleri: standart astronomik hesap (Diyanet'e yakın parametreler: İmsak 18°, Yatsı 17°, İkindi Şâfiî/1x gölge)
// tzOverride verilirse cihazın kendi saat dilimi yerine o kullanılır — İstanbul yedeğinde
// cihazın saat dilimi (kullanıcının gerçek konumu neresi olursa olsun) yanlış sonuç verebileceği
// için İstanbul'un sabit dilimi (+3, DST yok) açıkça geçilir.
function vakitHesapla(lat, lon, date, tzOverride){
  const rad = Math.PI/180, deg = 180/Math.PI;
  const jd0 = gregorianToJD(date.getFullYear(), date.getMonth()+1, date.getDate());
  const D = jd0 - 2451545.0;
  const g = (357.529 + 0.98560028*D) % 360;
  const q = (280.459 + 0.98564736*D) % 360;
  const L = (q + 1.915*Math.sin(g*rad) + 0.020*Math.sin(2*g*rad)) % 360;
  const e = 23.439 - 0.00000036*D;
  const decl = Math.asin(Math.sin(e*rad)*Math.sin(L*rad)) * deg;
  const RA = Math.atan2(Math.cos(e*rad)*Math.sin(L*rad), Math.cos(L*rad)) * deg / 15;
  let eqt = q/15 - (((RA%24)+24)%24);
  if(eqt > 12) eqt -= 24; if(eqt < -12) eqt += 24;
  const tzOffset = (tzOverride!=null) ? tzOverride : -date.getTimezoneOffset()/60;
  const noon = 12 + tzOffset - lon/15 - eqt;
  function sunAngleH(alphaDeg){
    // alphaDeg: ufkun altındaki açı (derece, pozitif değer)
    const cosH = (-Math.sin(alphaDeg*rad) - Math.sin(lat*rad)*Math.sin(decl*rad)) / (Math.cos(lat*rad)*Math.cos(decl*rad));
    if(cosH > 1 || cosH < -1) return null;
    return Math.acos(cosH) * deg / 15;
  }
  function asrH_hesapla(){
    const t = 1; // Şâfiî/standart gölge çarpanı
    const asrAlt = Math.atan(1/(t+Math.tan(Math.abs(lat-decl)*rad))) * deg; // ufuk üstü irtifa
    const cosH = (Math.sin(asrAlt*rad) - Math.sin(lat*rad)*Math.sin(decl*rad)) / (Math.cos(lat*rad)*Math.cos(decl*rad));
    if(cosH > 1 || cosH < -1) return null;
    return Math.acos(cosH) * deg / 15;
  }
  const fajrH = sunAngleH(18);
  const sunriseH = sunAngleH(0.833);
  const asrH = asrH_hesapla();
  const maghribH = sunAngleH(0.833);
  const ishaH = sunAngleH(17);
  function fmt(h){
    if(h===null) return '—';
    let hh = Math.floor(h), mm = Math.round((h-hh)*60);
    if(mm===60){mm=0;hh+=1;}
    hh = ((hh%24)+24)%24;
    return String(hh).padStart(2,'0')+':'+String(mm).padStart(2,'0');
  }
  // Diyanet temkin payları (dakika): Güneş −7, Öğle +5, İkindi +4, Akşam +7. İmsak ve Yatsı 0.
  const T = {gunes:-7/60, ogle:5/60, ikindi:4/60, aksam:7/60};
  const imsakH = fajrH!==null ? noon-fajrH : null;
  const gunesH = sunriseH!==null ? noon-sunriseH+T.gunes : null;
  const ogleH = noon+T.ogle;
  const ikindiH = asrH!==null ? noon+asrH+T.ikindi : null;
  const aksamH = maghribH!==null ? noon+maghribH+T.aksam : null;
  const yatsiH = ishaH!==null ? noon+ishaH : null;
  return {
    imsak: fmt(imsakH),
    gunes: fmt(gunesH),
    ogle: fmt(ogleH),
    ikindi: fmt(ikindiH),
    aksam: fmt(aksamH),
    yatsi: fmt(yatsiH),
    _noon: noon,
    _imsakH: imsakH,
    _gunesH: gunesH,
    _ogleH: ogleH,
    _ikindiH: ikindiH,
    _aksamH: aksamH,
    _yatsiH: yatsiH
  };
}
function suankiVakitDilimi(v){
  const now = new Date();
  const cur = now.getHours() + now.getMinutes()/60;
  function toNum(s){ if(s==='—') return null; const [h,m]=s.split(':').map(Number); return h+m/60; }
  const imsak=toNum(v.imsak), gunes=toNum(v.gunes), ogle=toNum(v.ogle), ikindi=toNum(v.ikindi), aksam=toNum(v.aksam), yatsi=toNum(v.yatsi);
  if(imsak!=null && cur>=imsak && cur<gunes) return 'sabah';
  if(gunes!=null && cur>=gunes && cur<ogle) return 'gunes';
  if(ogle!=null && cur>=ogle && cur<ikindi) return 'ogle';
  if(ikindi!=null && cur>=ikindi && cur<aksam) return 'ikindi';
  if(aksam!=null && cur>=aksam && cur<yatsi) return 'aksam';
  return 'yatsi';
}
// Şu an, bugünün İmsak'ı ile Akşam ezanı arasında mıyız (gündüz), yoksa dışında mıyız (gece)?
// Kandil/bayram tebriklerinin gece/gündüz metnini seçmek için kullanılır.
function gunduzMu(){
  const koordinat = AKTIF_KOORDINAT || ISTANBUL_KOORDINAT;
  const now = new Date();
  const v = vakitHesapla(koordinat.lat, koordinat.lon, now, aktifTz());
  if(v._imsakH===null || v._aksamH===null) return true;
  const cur = now.getHours() + now.getMinutes()/60;
  return cur >= v._imsakH && cur < v._aksamH;
}

function kibleAcisi(lat, lon){
  const r = Math.PI/180;
  const y = Math.sin((KABE.lon-lon)*r);
  const x = Math.cos(lat*r)*Math.tan(KABE.lat*r) - Math.sin(lat*r)*Math.cos((KABE.lon-lon)*r);
  return (Math.atan2(y, x)/r + 360) % 360;
}
// Bir sonraki namaz vaktine kalan süre
function sonrakiVakit(){
  const k = AKTIF_KOORDINAT || ISTANBUL_KOORDINAT;
  const now = new Date();
  const v = vakitHesapla(k.lat, k.lon, now, aktifTz());
  const cur = now.getHours() + now.getMinutes()/60 + now.getSeconds()/3600;
  const sira = [['İmsak',v._imsakH],['Güneş',v._gunesH],['Öğle',v._ogleH],['İkindi',v._ikindiH],['Akşam',v._aksamH],['Yatsı',v._yatsiH]];
  for(const [ad,h] of sira){ if(h!==null && h > cur) return {ad, dk: Math.ceil((h-cur)*60)}; }
  const yarin = new Date(now.getTime()+86400000);
  const vy = vakitHesapla(k.lat, k.lon, yarin, aktifTz());
  if(vy._imsakH===null) return null;
  return {ad:'İmsak', dk: Math.ceil((vy._imsakH + 24 - cur)*60)};

function calStripRender(){

    : KONUM_ISTANBUL_YEDEK ? `<span class="cal-note" title="Konum algılanamadı; vakitler İstanbul'a göre hesaplanmıştır">(İstanbul)</span>` : '';
  strip.innerHTML = `<span class="cal-item">${miladi}</span><span class="cal-sep">·</span><span class="cal-item">${hicri}</span>${konumNotu}<span class="cal-note" title="Vakitler Diyanet parametrelerine göre hesaplanmıştır; resmi vakitlerle birkaç dakika fark olabilir.">ⓘ</span>`;

function sehirUygula(ad){
  const il = ILLER.find(x=>x[0]===ad);
  if(!il) return false;
  AKTIF_SEHIR = il[0]; AKTIF_KOORDINAT = {lat:il[1], lon:il[2]}; KONUM_ISTANBUL_YEDEK = false;
  return true;
}
function konumBelirleVeBaslat(cb){
  const kayitli = hafizaOku('em_sehir', null);
  if(kayitli && sehirUygula(kayitli)){ cb(); return; }
  AKTIF_SEHIR = null;
  if(!navigator.geolocation){ AKTIF_KOORDINAT = ISTANBUL_KOORDINAT; KONUM_ISTANBUL_YEDEK = true; cb(); return; }
  navigator.geolocation.getCurrentPosition(
    pos => { AKTIF_KOORDINAT = {lat:pos.coords.latitude, lon:pos.coords.longitude}; KONUM_ISTANBUL_YEDEK = false; cb(); },
    () => { AKTIF_KOORDINAT = ISTANBUL_KOORDINAT; KONUM_ISTANBUL_YEDEK = true; cb(); },
    {timeout:6000, maximumAge:3600000}
  );
}
function konumSecimiDegisti(deger){
  if(deger==='__gps'){
    hafizaYaz('em_sehir', null);
  } else {
    hafizaYaz('em_sehir', deger);
  }
  konumBelirleVeBaslat(()=>{ calStripRender(); if(activeSection==='anasayfa') renderAnaSayfa(); });
}

const MUBAREK_GUNLER = [
  {ay:1, gun:1, ad:"Hicrî Yılbaşı"}, {ay:1, gun:10, ad:"Âşûrâ Günü"},
  {ay:3, gun:12, ad:"Mevlid Kandili", gece:true},
  {ay:7, gun:1, ad:"Üç Ayların Başlangıcı"}, {regaip:true, ay:7, ad:"Regâib Kandili", gece:true},
  {ay:7, gun:27, ad:"Mi'râc Kandili", gece:true}, {ay:8, gun:15, ad:"Berâat Kandili", gece:true},
  {ay:9, gun:1, ad:"Ramazân-ı Şerîf'in Başlangıcı"}, {ay:9, gun:27, ad:"Kadir Gecesi", gece:true},
  {ay:10, gun:1, ad:"Ramazan Bayramı"}, {ay:12, gun:9, ad:"Arefe Günü"}, {ay:12, gun:10, ad:"Kurban Bayramı"},
];
function yaklasanGunler(adet){
  const now = new Date();
  const bugunJD = gregorianToJD(now.getFullYear(), now.getMonth()+1, now.getDate());
  const h = hicriFromJD(bugunJD);
  const sonuc = [];
  [h.y, h.y+1].forEach(y=>{
    MUBAREK_GUNLER.forEach(g=>{
      const gun = g.regaip ? hicriAyIlkHaftaGunu(y, 7, 5) : g.gun;
      if(!gun) return;
      const jd = hicriToJD(y, g.ay, gun);
      const gosterJD = g.gece ? jd - 1 : jd; // kandil geceleri bir önceki günün akşamıdır
      if(gosterJD >= bugunJD) sonuc.push({...g, gun, gosterJD, kalan: gosterJD - bugunJD});
    });
  });
  return sonuc.sort((a,b)=>a.gosterJD-b.gosterJD).slice(0, adet);
}
function yaklasanGunlerKartHtml(){
  const l = yaklasanGunler(4);
  if(!l.length) return '';
  const satirlar = l.map(g=>{
    const d = jdToGregorianDate(g.gosterJD);
    const tarih = `${d.getDate()} ${MILADI_AYLAR[d.getMonth()]} ${GUN_ISIMLERI[d.getDay()]}${g.gece?' akşamı':''}`;
    const kalan = g.kalan===0 ? (g.gece?'Bu akşam':'Bugün') : g.kalan===1 ? (g.gece?'Yarın akşam':'Yarın') : `${g.kalan} gün sonra`;
    return `<div class="yaklasan-satir" data-ay="${g.ay}"><span class="yaklasan-ad">${g.ad}</span><span class="yaklasan-tarih">${tarih}</span><span class="yaklasan-kalan">${kalan}</span></div>`;
  }).join('');
  return `<div class="ana-kart ana-kart-liste"><div class="ana-kart-baslik">Yaklaşan Mübârek Gün ve Geceler</div>${satirlar}<div class="ana-kart-not">Tarihler hesapla bulunur; Diyanet'in ilânıyla bir gün fark olabilir.</div></div>`;
}

// Günün Virdi: namaz vaktine göre, öncelik sıralı, birden fazla vird birden gösterilebilir.
function itemByNo(groupKey, no){
  const grp = FIHRIST.find(g=>g.groupKey===groupKey);
  return grp ? grp.items.find(i=>i.no===no) : null;
}
function gununVirdiListesi(){
  const koordinat = AKTIF_KOORDINAT || ISTANBUL_KOORDINAT;
  const now = new Date();
  const v = vakitHesapla(koordinat.lat, koordinat.lon, now, aktifTz());
  if(v._imsakH===null || v._gunesH===null || v._ikindiH===null || v._aksamH===null || v._yatsiH===null){
    return tumOgeler('gunluk').slice(0,1).map(i=>({...i, groupKey:'gunluk'}));
  }
  const t0 = v._imsakH - 2;
  const cur = now.getHours() + now.getMinutes()/60;
  const rel = ((cur - t0) % 24 + 24) % 24;
  const relOf = (x)=> ((x - t0) % 24 + 24) % 24;
  const b = {
    imsak: 2,
    gunes: relOf(v._gunesH),
    ogle: relOf(v._ogleH),
    ikindi: relOf(v._ikindiH),
    aksam45: relOf(v._aksamH - 0.75),
    aksam: relOf(v._aksamH),
    yatsi: relOf(v._yatsiH),
    yatsiSonu: relOf(v._yatsiH + 2)
  };
  const g = (no)=> itemByNo('gunluk', no);
  const cuma = (now.getDay() === 5);
  let liste = [];
  if(rel < b.imsak){
    liste = [g(1), g(2), g(3), g(15), g(16)];
  } else if(rel < b.gunes){
    liste = [g(1), g(2), g(5), g(6), g(15), g(16)];
  } else if(rel < b.ogle){
    liste = [g(2), g(7)]; if(cuma) liste.push(g(4)); liste.push(g(6), g(15), g(16));
  } else if(rel < b.ikindi){
    liste = [g(2), g(8)]; if(cuma) liste.push(g(4)); liste.push(g(6), g(15), g(16));
  } else if(rel < b.aksam45){
    liste = [g(2), g(9), g(6), g(15), g(16)];
  } else if(rel < b.aksam){
    liste = [g(2), g(10), g(15), g(16)];
  } else if(rel < b.yatsi){
    liste = [g(2), g(11), g(12), g(15), g(16)];
  } else if(rel < b.yatsiSonu){
    liste = [g(2), g(13), g(12), g(15), g(16)];
  } else {
    liste = [g(2), g(14), g(12), g(15), g(16)];
  }
  return liste.filter(Boolean).map(i=>({...i, groupKey:'gunluk'}));
}
function gununVirdiKartHtml(liste){
  if(!liste.length){
    return `<div class="ana-kart ana-kart-bos"><div class="ana-kart-baslik">Günün Virdi</div><div class="ana-kart-durum">Yakında eklenecek</div></div>`;
  }
  // Not: Henüz içeriği eklenmemiş virdler de (bilerek) listede kalır, "Hazırlanıyor" rozetiyle gösterilir.
  const satirlar = liste.map(o=>{
    const okundu = o.ready && o.key && bugunOkunduMu(o.key);
    return `<div class="ana-kart-vird-satir${o.ready?'':' hazir-degil'}${okundu?' okundu':''}" data-group="${o.groupKey}" data-no="${o.no}">${okundu?'<span class="okundu-isaret" title="Bugün okundu">✓</span>':''}${o.title}${o.ready?'':'<span class="hazir-degil-rozet">Hazırlanıyor</span>'}</div>`;
  }).join('');
  const seri = seriGunSayisi();
  const seriNotu = seri > 1 ? `<div class="ana-kart-not">${seri} gündür aralıksız vird okuyorsunuz. Allah kabul etsin.</div>` : '';
  return `<div class="ana-kart ana-kart-liste"><div class="ana-kart-baslik">Günün Virdi</div>${satirlar}${seriNotu}</div>`;
}
// Haftanın Virdi: Cuma günü güneş doğuşundan akşam ezanına kadar Cuma namazı virdi;
// diğer zamanlarda kalan haftalık virdlerden biri, hafta boyunca sabit kalacak şekilde
// (yılın kaçıncı haftası olduğuna göre) sırayla seçilir.
function haftaninVirdiSec(){
  const now = new Date();
  if(now.getDay() === 5){
    const koordinat = AKTIF_KOORDINAT || ISTANBUL_KOORDINAT;
    const v = vakitHesapla(koordinat.lat, koordinat.lon, now, aktifTz());
    const cur = now.getHours() + now.getMinutes()/60;
    if(v._gunesH!==null && v._aksamH!==null && cur >= v._gunesH && cur < v._aksamH){
      const item = itemByNo('haftalik', 17);
      if(item) return {...item, groupKey:'haftalik'};
    }
  }
  const havuz = tumOgeler('haftalik').filter(i=>i.no !== 17);

function namazVaktiWidgetHtml(){
